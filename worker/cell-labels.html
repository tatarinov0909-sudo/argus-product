<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Этикетки ячеек — Аргус</title><link rel="stylesheet" href="cell-labels.css"></head>
<body>
<header><a class="button" href="loader.html">← К работе</a><div><p class="eyebrow">АРГУС · СКЛАД</p><h1>Этикетки ячеек</h1><p>Выберите ячейки, подготовьте QR и распечатайте адреса для размещения на складе.</p></div></header>
<main>
<section class="selection" aria-labelledby="selectTitle"><h2 id="selectTitle">1. Выберите ячейки</h2>
<label for="filter">Поиск по адресу ячейки</label><input id="filter" type="search" placeholder="Например, 1.2.3" autocomplete="off" disabled>
<div class="actions"><button id="selectAll" disabled>Выбрать найденные</button><button id="clear" disabled>Снять выбор</button></div>
<p id="status" role="status" aria-live="polite">Загружаем ячейки склада…</p><button id="retry" hidden>Повторить загрузку</button>
<div id="cells" class="cell-list"></div><p id="count">Выбрано: 0 из 100 за одну печать.</p>
<button id="prepare" class="primary" disabled>Подготовить этикетки</button>
</section>
<section class="preview" aria-labelledby="previewTitle"><div class="preview-head"><div><h2 id="previewTitle">2. Проверьте и распечатайте</h2><p id="printHint">QR появятся после подготовки. На этикетке будет адрес ячейки.</p></div><button id="print" class="primary" disabled>Печатать</button></div><div id="labels" class="labels"></div></section>
</main>
<script src="worker-config.js"></script><script src="auth.js"></script><script src="qrcode.min.js"></script><script src="cell-labels.js"></script>
</body></html>
