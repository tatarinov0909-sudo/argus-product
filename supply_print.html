<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Документы поставки — Аргус</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* Документ, а не кабинет.

     Отдельная страница, а не окно поверх кабинета: печатается лист бумаги,
     и всё, что не попадёт на эту бумагу, — помеха. Тёмная тема, боковое меню
     и панель контекста здесь были бы ровно этим. Белый фон и чёрный текст
     не ради красоты: чёрное на белом — единственное, что одинаково выходит
     на любом складском принтере, включая тот, в котором заканчивается
     тонер. */
  *{margin:0; padding:0; box-sizing:border-box;}
  :root{
    --ink:#000;
    --ink-soft:#555;
    --line:#000;
    --line-soft:#bbb;
    /* Волосяная линия сетки. Светлее рамки документа: она размечает, а не
       делит — иначе лист превращается в клетку. */
    --rule-hair:#c9c9c9;
    --warn:#a33;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', 'Consolas', monospace;
  }
  body{background:#e9e9e9; color:var(--ink); font-family:var(--sans); font-size:13px; line-height:1.45;}

  /* Панель управления — только на экране. */
  .bar{
    position:sticky; top:0; z-index:10; background:#1D2023; color:#EDEBE6;
    padding:12px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .bar b{font-size:14px;}
  .bar .grow{flex:1;}
  .btn{
    background:#5FAFA6; color:#182422; border:none; border-radius:8px;
    padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--sans);
  }
  .btn.ghost{background:transparent; color:#EDEBE6; border:1px solid #32363B;}
  .btn:hover{opacity:.9;}
  .hint{color:#8D9096; font-size:12px;}

  .sheet{
    background:#fff; width:210mm; min-height:297mm; margin:18px auto; padding:14mm 12mm;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
  }

  .doc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    border-bottom:2px solid var(--line); padding-bottom:7px; margin-bottom:9px;}
  .doc-title{font-size:19px; font-weight:700; line-height:1.15;}
  .doc-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .doc-num{font-family:var(--mono); font-size:22px; font-weight:700; text-align:right; white-space:nowrap;}
  .doc-num span{display:block; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--ink-soft);}

  /* Итоги — полосой во всю ширину, каждый по центру своей клетки.
     Прижатые к левому краю, они висели кучкой у угла, а справа зияло поле;
     при этом ниже идёт таблица во всю ширину, и шапка от неё отваливалась.
     Та же разлиновка, что в таблице: шапка и таблица читаются одним
     документом, а не двумя блоками, положенными рядом. */
  .facts{
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
    border-top:1.2px solid var(--line); border-bottom:1.2px solid var(--line);
    margin-bottom:9px;
  }
  .fact{text-align:center; padding:7px 6px 6px;}
  .fact + .fact{border-left:1px solid var(--rule-hair);}
  .fact b{display:block; font-family:var(--mono); font-size:16px; line-height:1.15;}
  .fact span{display:block; font-size:9px; color:var(--ink-soft); text-transform:uppercase;
    letter-spacing:.07em; margin-top:2px;}

  /* Складская форма, а не таблица из интерфейса.
     Колонки «обособлены» ровно потому, что их ничто не связывало: одни
     горизонтальные линии, и каждая ячейка стояла сама по себе. Волосяные
     линии между колонками — то, чем размечены все складские бланки, и они
     же держат строку целиком: в плохом свете и на ходу глаз не съезжает
     на соседнюю. Это форма, которую заполняют карандашом, а не таблица,
     на которую смотрят. */
  table{width:100%; border-collapse:collapse;}
  th{
    text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); border-bottom:1.2px solid var(--line); padding:0 5px 4px; font-weight:600;
  }
  th + th, td + td{border-left:1px solid var(--rule-hair);}
  /* Номер и клетка для галочки — одно поле, а не два: линия между двумя
     узкими колонками не размечает ничего и только дробит левый край. */
  th:first-child + th, td:first-child + td{border-left:0;}
  /* По центру строки, а не по верхнему краю.
     Название занимает две строки, а адрес, артикул и количество — одну;
     при выравнивании по верху они висели у потолка, и глаз собирал строку
     из кусков, стоящих на разной высоте. */
  td{padding:4px 5px; border-bottom:1px solid var(--rule-hair); vertical-align:middle;}
  tr{break-inside:avoid;}
  .num{text-align:right; font-family:var(--mono);}
  /* Одна яркость на всю строку.
     Данные — чёрные, различаются только размером. Серым остаётся ровно то,
     что служебное: наш код номенклатуры и незначащая часть штрихкода.
     Разная яркость у равных по смыслу чисел читается как разная важность,
     и строка рассыпается. */
  .cellno{text-align:center; font-family:var(--mono); font-size:9px; color:var(--ink-soft);}
  .mid{text-align:center;}
  .mono{font-family:var(--mono);}

  /* Полоса ряда. Адрес в каждой строке повторял «01-» столько раз, сколько
     позиций в ряду, — а это самая широкая колонка листа. Ряд выносится
     заголовком, в строках остаётся хвост: «04-001». Заодно видно структуру
     обхода: сколько позиций в каждом ряду и куда идти дальше.

     И один заголовок «не найдено в ячейках» вместо восемнадцати одинаковых
     красных надписей подряд. Восемнадцать повторов — уже не предупреждение,
     а фон, который перестают читать. */
  /* Полоса ряда — без заливки.
     Серый фон на складском принтере печатается точечным растром и выглядит
     грязью, а тонера съедает как чёрный. Полосу держат линии и разрядка:
     на бумаге это читается чище, чем плашка, и не зависит от того, сколько
     тонера осталось в картридже. */
  .band td{
    border-top:1.2px solid var(--line); border-bottom:0.8px solid var(--line);
    border-left:0 !important;
    padding:7px 5px 3px; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  }
  .band.miss td{color:var(--warn); border-color:var(--warn);}
  .band .band-count{font-weight:400; color:var(--ink-soft);}
  .band.miss .band-count{color:var(--warn);}

  /* Хвост штрихкода крупно — приём подсмотрен у чужого листа и он верный:
     сверяют по последним цифрам, а не по всем тринадцати. Но крупными
     показываем ровно столько знаков, сколько РАЗЛИЧАЮТ товар на этом листе.
     Четыре цифры уникальны на десяти позициях и совпадают на двухстах, и
     тогда крупная цифра уводит не к тому товару — хуже, чем её отсутствие. */
  /* Штрихкод в два яруса: незначащая часть сверху мелко, различающий хвост
     снизу крупно. Так же устроен и адрес ячейки — и от этого строка читается
     двумя сплошными полосами через весь лист, а не семью островами. */
  .bc{font-family:var(--mono); font-size:8.5px; color:var(--ink-soft); text-align:center;
    white-space:nowrap; line-height:1.15;}
  .bc b{display:block; font-size:13px; color:var(--ink); letter-spacing:.02em; font-weight:700;}

  /* Адрес ячейки в два яруса: стеллаж сверху, место снизу. Один ярус —
     это «04-001» одной строкой, и колонка под него нужна вдвое шире; тем же
     местом на листе оплачивалось название. Стеллаж мельче не потому, что
     он менее важен, а потому что внутри ряда их немного и глаз находит его
     сразу; место — то, что различает соседние строки. */
  .row-addr{font-family:var(--mono); text-align:center; line-height:1.1; white-space:nowrap;}
  .row-addr span{display:block; font-size:10px; color:var(--ink-soft);}
  .row-addr b{display:block; font-size:15px; font-weight:700;}
  .row-addr.one b{font-size:13px;}
  /* Артикул продавца — первым и крупно.
     Это то, чем товар подписан на коробке и чем его зовут на площадке;
     наш код номенклатуры (PB…) кладовщику ни о чём не говорит и стоит
     последним, мелким — он нужен, когда разбирают расхождение, а не когда
     снимают коробку с полки. */
  /* Артикул — свой столбец, как штрихкод и количество. Внутри строки он
     тянул на себя всю ширину; столбцом он занимает ровно то, что нужно
     цифрам, и его видно сверху вниз по всему листу. */
  .goods-art{font-family:var(--mono); font-size:11.5px; font-weight:700; line-height:1.15; text-align:center;}
  /* Наш код номенклатуры — на той же строке, мелким. Отдельной строки он
     не стоит: три строки на позицию съедают ровно тот лист, который
     освободил убранный QR. */
  .goods-art i{display:block; font-style:normal; font-weight:400; font-size:8.5px;
    color:var(--ink-soft); letter-spacing:-0.02em;}
  /* Название мельче и в два яруса: одной строкой во всю ширину оно съедало
     место, которое нужно адресу, артикулу и штрихкоду. Не обрезаем: два
     «Батончика Грильяж» различаются как раз хвостом названия, и обрезка
     сделала бы разные строки одинаковыми. */
  /* Название — не шире того, что ему нужно.
     Колонка забирала весь остаток ширины листа, потому что все соседние
     фиксированы; длинные названия шли одной строкой во всю страницу и
     тянули на себя взгляд. Теперь колонка ограничена, длинное имя
     переносится на второй ярус — как и всё остальное в этой строке.
     Не обрезаем: два «Батончика Грильяж» различаются как раз хвостом. */
  .goods-line{font-weight:600; font-size:10.5px; line-height:1.25;}
  td.goods{width:44%;}

  /* Заказ и отправление — парой, в два яруса. Оба длинные, оба сверяют
     глазами: номер заказа по списку, номер отправления по стикеру на
     коробке. Двумя колонками они занимали пятую часть листа. */
  .pair{font-family:var(--mono); text-align:center; line-height:1.2;}
  .pair span{display:block; font-size:8.5px; color:var(--ink-soft);}
  .pair b{display:block; font-size:10.5px; font-weight:700; word-break:break-all;}

  /* Клетка под факт. На бумаге всегда нужно место записать, сколько взяли
     на самом деле: «взял 3 из 4» — это то, ради чего лист и возвращается
     с полки. Заодно она забирает ширину, которую отдало название. */
  .fact-box{border-left:1px solid var(--rule-hair);}

  /* Смена ряда — линией, а не заголовком. */
  tr.aisle td{border-top:1.2px solid var(--line);}
  td.tight{padding-top:4px; padding-bottom:4px;}

  /* Адрес ячейки — самое крупное в строке. Кладовщик ведёт по нему глазами
     вдоль стеллажа, всё остальное читается уже у полки. */
  .addr{font-family:var(--mono); font-size:15px; font-weight:700; white-space:nowrap;}
  .addr-more{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); font-weight:400;}
  .qty{font-family:var(--mono); font-size:16px; font-weight:700;}

  /* Место под фото. Ключа с категорией «Контент» у нас нет, картинки взять
     негде — но рамка на бумаге нужна уже сейчас: по ней кладовщик сверяет
     товар глазами, и её отсутствие меняет вёрстку листа. Пустая рамка честнее
     подписи «фото будет позже». */
  .photo{width:52px; height:52px; border:1px dashed var(--line-soft); border-radius:3px;
    display:flex; align-items:center; justify-content:center; font-size:8px;
    color:var(--line-soft); text-align:center; line-height:1.1;}

  /* Клетка для галочки. Лист комплектации — рабочий документ: по нему идут
     и отмечают карандашом, что взято. */
  .tick{width:15px; height:15px; border:1.5px solid var(--ink); border-radius:2px;}

  .short{color:var(--warn); font-weight:600;}
  .short-note{font-size:10.5px; color:var(--warn);}

  .doc-foot{margin-top:10px; padding-top:7px; border-top:1px solid var(--line-soft);
    display:flex; justify-content:space-between; gap:20px; font-size:10.5px; color:var(--ink-soft);}
  .sign{margin-top:12px; display:flex; gap:40px;}
  .sign div{flex:1;}
  .sign-line{border-bottom:1px solid var(--ink); height:20px;}
  .sign-label{font-size:10px; color:var(--ink-soft); margin-top:3px;}

  .empty{padding:30px; text-align:center; color:var(--ink-soft);}

  @media print{
    /* Печатаем только бумагу. */
    body{background:#fff;}
    .bar{display:none;}
    .sheet{width:auto; min-height:0; margin:0; padding:0; box-shadow:none;}
    /* Каждый документ — со своей страницы. */
    .sheet + .sheet{break-before:page;}
    .hide-on-print{display:none !important;}
    @page{size:A4 portrait; margin:12mm;}
    thead{display:table-header-group;} /* шапка таблицы повторяется на каждой странице */
  }
</style>
</head>
<body>

<div class="bar">
  <b>Документы поставки</b>
  <span class="hint" id="barStatus">Загружаем…</span>
  <span class="grow"></span>
  <button class="btn ghost" type="button" id="modeDense" onclick="setMode('dense')">Компактный</button>
  <button class="btn ghost" type="button" id="modePhoto" onclick="setMode('photo')">С фото</button>
  <span style="width:12px;"></span>
  <button class="btn" type="button" onclick="printOnly('pick')">Печать листа комплектации</button>
  <button class="btn ghost" type="button" onclick="printOnly('pack')">Печать упаковочного</button>
  <button class="btn ghost" type="button" onclick="printOnly(null)">Печать обоих</button>
  <button class="btn ghost" type="button" onclick="window.close()">Закрыть</button>
</div>

<div id="docs"></div>

<script>
(function(){
  'use strict';

  const API_BASE = 'https://api.argus-ai.online';
  const TOKEN = localStorage.getItem('argus_token');
  const supplyId = new URLSearchParams(location.search).get('id');

  // Плотный по умолчанию: фотографий у нас пока нет, и пустая рамка под них
  // задавала высоту каждой строки — треть листа уходила на прямоугольники,
  // в которых ничего нет. Режим «с фото» оставлен готовым: появится ключ
  // с категорией «Контент» — включится он.
  let MODE = localStorage.getItem('argus_pick_mode') === 'photo' ? 'photo' : 'dense';
  let LAST = null;

  // Экранирование для разметки — то же правило, что в кабинетах: подменяем
  // и кавычки, потому что значения попадают и в атрибуты тоже.
  const ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ESCAPE_MAP[c]);
  }

  function plural(n, one, few, many){
    const m100 = n % 100; const m10 = n % 10;
    if(m100 >= 11 && m100 <= 14) return many;
    if(m10 === 1) return one;
    if(m10 >= 2 && m10 <= 4) return few;
    return many;
  }

  const nf = (n) => Number(n).toLocaleString('ru-RU');

  function when(iso){
    if(!iso) return '—';
    return new Date(iso).toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit',
    });
  }

  function fail(text){
    document.getElementById('barStatus').textContent = '';
    document.getElementById('docs').innerHTML =
      '<div class="sheet"><div class="empty">' + esc(text) + '</div></div>';
  }

  async function load(){
    if(!TOKEN){ fail('Нет входа. Откройте кабинет и войдите заново.'); return; }
    if(!supplyId){ fail('Не указана поставка.'); return; }
    let data;
    try{
      const res = await fetch(API_BASE + '/api/supplies/' + encodeURIComponent(supplyId), {
        headers: { 'Authorization': 'Bearer ' + TOKEN },
      });
      if(res.status === 401){ fail('Сессия истекла. Откройте кабинет и войдите заново.'); return; }
      data = await res.json();
      if(!res.ok) throw new Error((data && data.error) || 'Ошибка запроса');
    } catch(e){
      fail('Не удалось загрузить поставку: ' + e.message);
      return;
    }
    LAST = data;
    render(data);
  }

  function setMode(mode){
    MODE = mode;
    try{ localStorage.setItem('argus_pick_mode', mode); } catch(e){ /* приватное окно */ }
    paintModeButtons();
    if(LAST) render(LAST);
  }
  window.setMode = setMode;

  function paintModeButtons(){
    const dense = document.getElementById('modeDense');
    const photo = document.getElementById('modePhoto');
    if(!dense || !photo) return;
    dense.classList.toggle('ghost', MODE !== 'dense');
    photo.classList.toggle('ghost', MODE !== 'photo');
  }

  function render(data){
    const s = data.supply;
    const t = data.totals;
    document.title = 'Поставка ' + s.number + ' — документы';
    document.getElementById('barStatus').textContent =
      s.number + ' · ' + s.companyName + ' · ' + s.statusName;
    document.getElementById('docs').innerHTML = pickingSheet(s, t, data.picking)
      + packingSheet(s, t, data.packing);
    paintModeButtons();
  }

  function head(s, title, sub){
    return '<div class="doc-head">'
      + '<div><div class="doc-title">' + esc(title) + '</div>'
      +   '<div class="doc-sub">' + esc(sub) + '</div></div>'
      + '<div class="doc-num">' + esc(s.number)
      +   '<span>' + esc(s.companyName) + '</span></div>'
      + '</div>';
  }

  function foot(s, extra){
    return '<div class="doc-foot"><div>' + esc(extra) + '</div>'
      + '<div>Аргус · напечатано ' + when(new Date().toISOString()) + '</div></div>';
  }

  // ---------- Лист комплектации ----------
  //
  // Сводный: одинаковые артикулы из разных заказов сложены в одну строку.
  // Иначе за одним и тем же товаром кладовщик идёт столько раз, сколько
  // заказов, — а их бывает полторы сотни.
  //
  // Порядок строк задаёт сервер, по адресу ячейки. Здесь он превращается
  // в полосы по рядам: лист существует ради того, чтобы пройти склад один
  // раз, и структура обхода должна быть видна глазами, а не собираться
  // в голове из повторяющихся префиксов.

  // Сколько последних знаков штрихкода различают товар на ЭТОМ листе.
  // Меньше четырёх не берём (глазу не за что зацепиться), больше шести
  // незачем. Если не различают и шесть — крупную подсказку не рисуем вовсе.
  function tailLength(rows){
    // По РАЗНЫМ штрихкодам, а не по строкам. В упаковочном листе один и тот
    // же товар стоит столько раз, сколько его посылок, — и одинаковые коды
    // сравнивались между собой как разные. Хвост оказывался «неуникальным»
    // всегда, и выделение молча отключалось на всём листе.
    const codes = [...new Set(rows.map(r => String(r.barcode || '')).filter(Boolean))];
    for(const len of [4, 5, 6]){
      const seen = new Set();
      let clash = false;
      for(const c of codes){
        const tail = c.slice(-len);
        if(seen.has(tail)){ clash = true; break; }
        seen.add(tail);
      }
      if(!clash) return len;
    }
    return 0;
  }

  // Внутри полосы ряда номер ряда из адреса убираем: он написан в заголовке.
  // Отрезаем только настоящий префикс — «01-» у адреса «01-04-001». Чужой
  // формат (у ячейки может быть любое имя со стеллажа) оставляем целиком:
  // подрезать незнакомую строку значит однажды отрезать значащую часть.
  // Адрес целиком, в одном месте.
  //
  // Ряд стоял заголовком полосы, а в строке оставался хвост — и адрес
  // оказывался разорван на две части, разнесённые по листу. На бумаге это
  // хуже, чем на экране: полоса может остаться на предыдущей странице, а
  // человек в проходе не помнит, в каком он ряду. Адрес читается там же,
  // где всё остальное про эту позицию.
  //
  // Два яруса при этом сохраняются: ряд со стеллажом сверху, место снизу.
  // Делим по ПОСЛЕДНЕМУ разделителю — место всегда последнее, сколько бы
  // частей ни было в имени ячейки. Неразделимое имя показываем целиком:
  // резать незнакомую строку значит однажды отрезать значащее.
  function addrTiers(label){
    const s = String(label);
    const i = Math.max(s.lastIndexOf('-'), s.lastIndexOf('.'), s.lastIndexOf('/'), s.lastIndexOf(' '));
    return i > 0
      ? '<div class="row-addr"><span>' + esc(s.slice(0, i)) + '</span><b>' + esc(s.slice(i + 1)) + '</b></div>'
      : '<div class="row-addr one"><b>' + esc(s) + '</b></div>';
  }

  // Чем считается «ряд» для полосы.
  //
  // Именем ячейки, а не нашим номером ряда. На стеллаже висит «01-04-001»,
  // и первое число в этом имени — то, что кладовщик считает рядом. Наш
  // `row_num` — внутренняя нумерация, и совпасть с наклейкой она не обязана:
  // ячейки приезжают из 1С с готовыми именами, а порядок строк мы всё равно
  // берём от сервера. Полоса, назвавшая «ряд 07» над адресами «01-…», хуже
  // отсутствия полосы: она уводит человека не туда.
  function groupOf(cell){
    if(!cell) return null;
    const label = String(cell.label || '');
    const m = label.match(/^([0-9A-Za-zА-Яа-я]+)[-./ ]/);
    if(m) return m[1];
    return cell.rowNum == null ? label : String(cell.rowNum).padStart(2, '0');
  }

  function pickingSheet(s, t, rows){
    if(!rows || rows.length === 0){
      return '<div class="sheet" data-doc="pick">' + head(s, 'Лист комплектации', '')
        + '<div class="empty">В поставке нет позиций.</div></div>';
    }
    const withPhoto = MODE === 'photo';
    const tail = tailLength(rows);
    const short = rows.filter(r => r.available < r.qty).length;

    // Полосы: по рядам в порядке обхода, ненайденное — отдельной группой
    // в конце. Порядок строк внутри уже задан сервером, здесь только режем
    // на группы, не пересортировывая.
    const groups = [];
    let current = null;
    for(const r of rows){
      const key = groupOf(r.cells && r.cells[0]);
      if(!current || current.key !== key){
        current = { key, rows: [] };
        groups.push(current);
      }
      current.rows.push(r);
    }

    let n = 0;
    const body = groups.map((g) => {
      const count = g.rows.length;
      // Полоса осталась одна — та, что отделяет собираемое от несобираемого.
      // Это не разрыв адреса, а граница между «идти и брать» и «искать».
      // Смену ряда показывает линия потолще на первой строке ряда: обход
      // виден, а адрес при этом не разъезжается по листу.
      const band = g.key === null
        ? '<tr class="band miss"><td colspan="' + (8 + (withPhoto ? 1 : 0)) + '">'
          + 'Не найдено в ячейках <span class="band-count">· ' + count + ' '
          + plural(count, 'позиция', 'позиции', 'позиций')
          + ' · искать по складу или ждать приёмку</span></td></tr>'
        : '';

      const lines = g.rows.map((r, k) => {
        n += 1;
        // Первая строка нового ряда — линия потолще: видно, где кончается
        // один ряд и начинается следующий, без выноса номера из строки.
        const newAisle = k === 0 && g.key !== null && groups.indexOf(g) > 0;
        const cells = r.cells || [];
        const first = cells[0];
        const rest = cells.slice(1);
        const notEnough = r.available < r.qty;
        const bc = String(r.barcode || '');
        return '<tr' + (newAisle ? ' class="aisle"' : '') + '>'
          + '<td class="cellno" style="width:20px;">' + n + '</td>'
          + '<td class="mid" style="width:22px;"><div class="tick"></div></td>'
          + '<td style="width:58px;">'
          +   (first
                ? addrTiers(first.label)
                  + (rest.length ? '<div class="addr-more">+' + rest.length + '</div>' : '')
                : '<div class="row-addr one short"><b>—</b></div>')
          + '</td>'
          + (withPhoto ? '<td class="mid" style="width:40px;"><div class="photo">фото</div></td>' : '')
          + '<td style="width:70px;">'
          +   '<div class="goods-art">'
          +     (r.article ? esc(r.article) : '<span class="short">нет арт.</span>')
          +     '<i>' + esc(r.sku) + '</i>'
          +   '</div>'
          + '</td>'
          + '<td class="goods">'
          +   '<div class="goods-line">' + esc(r.name) + '</div>'
          +   (notEnough && r.available > 0
                ? '<div class="short-note">в ячейках только ' + nf(r.available) + '</div>'
                : '')
          + '</td>'
          + '<td class="bc" style="width:62px;">'
          +   (bc
                ? (tail
                    ? esc(bc.slice(0, bc.length - tail)) + '<b>' + esc(bc.slice(-tail)) + '</b>'
                    : '<b style="font-size:11px;">' + esc(bc) + '</b>')
                : '')
          + '</td>'
          + '<td class="num" style="width:38px;"><span class="qty' + (notEnough ? ' short' : '') + '">'
          +   nf(r.qty) + '</span></td>'
          + '<td class="fact-box" style="width:46px;"></td>'
          + '</tr>';
      }).join('');
      return band + lines;
    }).join('');

    return '<div class="sheet" data-doc="pick">'
      + head(s, 'Лист комплектации', 'Собрать со склада. Одинаковые артикулы сложены — за товаром идём один раз, по рядам.')
      + '<div class="facts">'
      +   '<div class="fact"><b>' + nf(t.uniqueSkus) + '</b><span>позиций</span></div>'
      +   '<div class="fact"><b>' + nf(t.units) + '</b><span>штук всего</span></div>'
      +   '<div class="fact"><b>' + nf(t.orders) + '</b><span>' + plural(t.orders, 'заказ', 'заказа', 'заказов') + '</span></div>'
      +   '<div class="fact"><b>' + when(s.createdAt) + '</b><span>поставка собрана</span></div>'
      + '</div>'
      + (short > 0
          ? '<div class="short-note" style="margin-bottom:8px;">По ' + short + ' '
            + plural(short, 'позиции', 'позициям', 'позициям')
            + ' в ячейках меньше, чем нужно, — они отмечены в списке и собраны в нижнюю группу.</div>'
          : '')
      + '<table><thead><tr>'
      +   '<th></th><th></th><th class="mid">Ячейка</th>' + (withPhoto ? '<th></th>' : '')
      +   '<th class="mid">Артикул</th><th>Товар</th>'
      +   '<th class="bc">Штрихкод</th><th class="num">Взять</th><th class="mid">Факт</th>'
      + '</tr></thead><tbody>' + body + '</tbody></table>'
      + '<div class="sign">'
      +   '<div><div class="sign-line"></div><div class="sign-label">Собрал — фамилия, подпись</div></div>'
      +   '<div><div class="sign-line"></div><div class="sign-label">Дата и время</div></div>'
      + '</div>'
      + foot(s, 'Лист комплектации')
      + '</div>';
  }

  // ---------- Упаковочный лист ----------
  //
  // Построчно, по заказам: здесь одинаковые артикулы НЕ складываются. У
  // каждой посылки свой номер отправления и свой стикер, и сложить две
  // одинаковые позиции значит отправить одну коробку вместо двух.
  function packingSheet(s, t, rows){
    if(!rows || rows.length === 0) return '';
    const tail = tailLength(rows);
    // Два яруса и здесь, там же где у листа комплектации: заказ над номером
    // отправления, артикул над нашим кодом, незначащая часть штрихкода над
    // различающим хвостом. Заказ и отправление были двумя колонками из
    // длинных кодов — вместе они занимают одну и читаются парой, потому что
    // и сверяют их вместе: заказ по списку, отправление по стикеру.
    const body = rows.map((r, i) => {
      const bc = String(r.barcode || '');
      return '<tr>'
        + '<td class="cellno" style="width:20px;">' + (i + 1) + '</td>'
        + '<td class="mid" style="width:22px;"><div class="tick"></div></td>'
        + '<td class="pair" style="width:104px;">'
        +   '<span>' + esc(r.orderNumber) + '</span>'
        +   (r.rid ? '<b>' + esc(r.rid) + '</b>' : '<b class="short">нет отправления</b>')
        + '</td>'
        + '<td style="width:70px;">'
        +   '<div class="goods-art">'
        +     (r.article ? esc(r.article) : '<span class="short">нет арт.</span>')
        +     '<i>' + esc(r.sku) + '</i>'
        +   '</div>'
        + '</td>'
        + '<td class="goods"><div class="goods-line">' + esc(r.name) + '</div></td>'
        + '<td class="bc" style="width:62px;">'
        +   (bc
              ? (tail
                  ? esc(bc.slice(0, bc.length - tail)) + '<b>' + esc(bc.slice(-tail)) + '</b>'
                  : '<b style="font-size:11px;">' + esc(bc) + '</b>')
              : '')
        + '</td>'
        + '<td class="num" style="width:38px;"><span class="qty">' + nf(r.qty) + '</span></td>'
        + '<td class="fact-box" style="width:46px;"></td>'
        + '</tr>';
    }).join('');

    return '<div class="sheet" data-doc="pack">'
      + head(s, 'Упаковочный лист', 'Разложить по посылкам. Одинаковые артикулы НЕ складываются: у каждой посылки свой номер отправления.')
      + '<div class="facts">'
      +   '<div class="fact"><b>' + nf(rows.length) + '</b><span>' + plural(rows.length, 'посылка', 'посылки', 'посылок') + '</span></div>'
      +   '<div class="fact"><b>' + nf(t.units) + '</b><span>штук всего</span></div>'
      +   '<div class="fact"><b>' + esc(s.destination || '—') + '</b><span>куда</span></div>'
      +   '<div class="fact"><b>' + esc((s.marketplace || '—').toUpperCase()) + '</b><span>площадка</span></div>'
      + '</div>'
      + '<table><thead><tr>'
      +   '<th></th><th></th><th class="mid">Заказ и отправление</th>'
      +   '<th class="mid">Артикул</th><th>Товар</th>'
      +   '<th class="bc">Штрихкод</th><th class="num">Кол-во</th><th class="mid">Факт</th>'
      + '</tr></thead><tbody>' + body + '</tbody></table>'
      + '<div class="sign">'
      +   '<div><div class="sign-line"></div><div class="sign-label">Упаковал — фамилия, подпись</div></div>'
      +   '<div><div class="sign-line"></div><div class="sign-label">Передал водителю — подпись</div></div>'
      + '</div>'
      + foot(s, 'Упаковочный лист')
      + '</div>';
  }

  // Печать одного из двух документов: класс снимается сразу после печати,
  // чтобы страница не осталась наполовину спрятанной, если человек нажал
  // «отмена» в окне принтера.
  function printOnly(doc){
    const sheets = document.querySelectorAll('.sheet');
    sheets.forEach((el) => {
      el.classList.toggle('hide-on-print', Boolean(doc) && el.dataset.doc !== doc);
    });
    window.print();
    setTimeout(() => sheets.forEach((el) => el.classList.remove('hide-on-print')), 500);
  }
  window.printOnly = printOnly;

  load();
})();
</script>
</body>
</html>
