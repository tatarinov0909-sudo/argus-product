<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Аргус — Акты приёмки</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --bg:#111315;
    --panel:#1D2023;
    --panel-2:#25282C;
    --line:#32363B;
    --line-soft:#2A2E32;
    --accent:#5FAFA6;
    --accent-2:#7FC9BE;
    --accent-soft:#243634;
    --terracotta:#D98E6E;
    --terracotta-soft:#332822;
    --text:#EDEBE6;
    --muted:#8D9096;
    --mono:'IBM Plex Mono', monospace;
    --sans:'Inter', sans-serif;
    --ease:cubic-bezier(0.16, 1, 0.3, 1);
    --shadow-sm:0 2px 10px rgba(0,0,0,0.24);
    --shadow-md:0 12px 32px rgba(0,0,0,0.34);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scrollbar-color:var(--line) transparent;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px; border:2px solid var(--panel);}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}
  ::selection{background:rgba(95,175,166,0.32); color:var(--text);}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes fadeInUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Экран ввода ключа ---------- */
  .key-screen{
    position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at top right, rgba(95,175,166,0.10), transparent 55%),
      radial-gradient(circle at bottom left, rgba(95,175,166,0.08), transparent 50%),
      var(--bg);
  }
  .key-screen::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(ellipse 70% 55% at 50% 40%, black 25%, transparent 72%);
  }
  .key-card{
    position:relative; z-index:1;
    width:100%; max-width:360px;
    background:linear-gradient(165deg, var(--panel) 0%, #1A1C1F 100%);
    border:1px solid var(--line-soft); border-radius:18px;
    padding:36px 32px; text-align:center; box-shadow:var(--shadow-md);
    animation:fadeInUp 0.4s var(--ease) both;
  }
  .key-mark{
    width:52px; height:52px; border-radius:14px;
    background:linear-gradient(145deg, var(--accent-soft), #1D2E2C); margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 18px rgba(95,175,166,0.12);
  }
  .key-title{font-size:17px; font-weight:700; margin-bottom:6px;}
  .key-sub{font-size:12.5px; color:var(--muted); line-height:1.55; margin-bottom:22px;}
  .key-input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; color:var(--text); font-family:var(--mono); font-size:15px; letter-spacing:1.5px;
    text-align:center; margin-bottom:12px;
    transition:border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .key-input::placeholder{color:var(--muted); letter-spacing:normal; font-family:var(--sans); font-size:13px;}
  .key-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3.5px rgba(95,175,166,0.14);}
  .key-error{font-size:12px; color:var(--terracotta); margin-bottom:10px; display:none; text-align:left;}
  .key-error.show{display:block; animation:fadeInUp 0.25s var(--ease) both;}
  .key-btn{
    width:100%; padding:12px; border-radius:9px; border:none;
    background:linear-gradient(135deg, var(--accent-2), var(--accent)); color:#132422;
    font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--sans);
    box-shadow:0 4px 16px rgba(95,175,166,0.22);
    transition:transform 0.2s var(--ease), box-shadow 0.2s var(--ease), filter 0.2s var(--ease);
  }
  .key-btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(95,175,166,0.32); filter:brightness(1.04); opacity:1;}
  .key-btn:active{transform:translateY(0);}

  /* ---------- Рабочая панель ---------- */
  .workspace{display:none; min-height:100vh; flex-direction:column;}
  .workspace.show{display:flex;}

  .ws-header{
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
    padding:16px 28px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .ws-brand{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .ws-brand-dot{width:20px; height:13px; flex-shrink:0;}
  .ws-current-account{font-size:12.5px; color:var(--accent); font-weight:600; background:var(--accent-soft); padding:7px 13px; border-radius:8px;}
  .ws-logout{font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline;}

  .ws-body{display:flex; flex:1; min-height:0;}

  .resize-handle{width:9px; flex-shrink:0; cursor:col-resize; position:relative; z-index:20; background:transparent;}
  .resize-handle::before{
    content:''; position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--line);
    transform:translateX(-50%); transition:background 0.15s, width 0.15s;
  }
  .resize-handle:hover::before, .resize-handle.dragging::before{background:var(--accent); width:2px;}

  .ws-dates{width:190px; flex-shrink:0; background:var(--panel); padding:18px 12px; overflow-y:auto;}
  .ws-dates-title{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; padding:0 8px; margin-bottom:10px;}
  .ws-date-item{
    display:block; width:100%; text-align:left; padding:10px 12px; border-radius:8px; border:none; background:none;
    color:var(--text); font-family:var(--sans); font-size:13px; cursor:pointer; margin-bottom:2px;
  }
  .ws-date-item:hover{background:var(--panel-2);}
  .ws-date-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .ws-date-item .num{display:block; font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:2px;}
  .ws-date-item.active .num{color:var(--accent); opacity:0.8;}
  .ws-date-item.warn::before{content:'●'; color:var(--terracotta); font-size:8px; margin-right:6px; vertical-align:middle;}

  .ws-mode-switch{display:flex; gap:6px; padding:0 8px; margin-bottom:16px;}
  .ws-mode-btn{
    flex:1; padding:8px 10px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); font-size:11.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
  }
  .ws-mode-btn:hover{border-color:var(--accent);}
  .ws-mode-btn.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

  .ws-dates-head{display:flex; justify-content:space-between; align-items:center; padding:0 8px; margin-bottom:10px; position:relative;}
  .ws-dates-head .ws-dates-title{padding:0; margin-bottom:0;}
  .cal-btn{
    width:26px; height:26px; border-radius:7px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cal-btn:hover{color:var(--accent); border-color:var(--accent);}

  .cal-popover{
    display:none; position:fixed; z-index:150; width:260px; max-width:calc(100vw - 40px);
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 14px 34px rgba(0,0,0,0.5);
  }
  .cal-popover.open{display:block;}
  .cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:12.5px; font-weight:700;}
  .cal-head button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 6px; border-radius:5px;}
  .cal-head button:hover{background:var(--panel); color:var(--accent);}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px;}
  .cal-dow{font-size:9.5px; color:var(--muted); text-align:center; padding:4px 0;}
  .cal-day{
    font-size:11.5px; text-align:center; padding:6px 0; border-radius:6px; cursor:default; color:var(--line);
    font-family:var(--mono); background:none; border:none;
  }
  .cal-day.has-act{color:var(--text); cursor:pointer; position:relative;}
  .cal-day.has-act:hover{background:var(--panel);}
  .cal-day.has-act.warn::after{content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--terracotta);}
  .cal-day.has-act:not(.warn)::after{content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .cal-day.selected{background:var(--accent-soft); color:var(--accent); font-weight:700;}

  .ws-content{flex:1; overflow-y:auto; padding:32px; display:flex; justify-content:center;}

  /* ---------- Карточка акта ---------- */
  .act-wrap{width:100%; max-width:640px;}
  .act-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 36px;}

  .total-head{margin-bottom:24px;}
  .total-title{font-size:19px; font-weight:700; margin-bottom:4px;}
  .total-sub{font-size:12.5px; color:var(--muted);}
  .total-current{
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px; padding:18px 20px;
    margin-bottom:26px; display:flex; justify-content:space-between; align-items:center;
  }
  .total-current-label{font-size:12px; color:var(--muted);}
  .total-current-num{font-size:26px; font-weight:700; font-family:var(--mono); color:var(--accent);}
  .total-table{width:100%; border-collapse:collapse;}
  .total-table th{
    text-align:left; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;
    padding:0 12px 10px; font-weight:600; border-bottom:1px solid var(--line);
  }
  .total-table th.num, .total-table td.num{text-align:right;}
  .total-table td{padding:12px; font-size:13px; border-bottom:1px solid var(--line); font-family:var(--mono);}
  .total-table tr:last-child td{border-bottom:none;}
  .total-table td.month-sep{
    font-family:var(--sans); font-weight:700; color:var(--text); background:var(--panel-2); font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.4px; padding-top:14px; padding-bottom:6px; border-bottom:none;
  }
  .total-table .running{color:var(--accent); font-weight:700;}
  .total-table .delta{color:var(--muted);}
  .act-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px; gap:16px; flex-wrap:wrap;}
  .act-head-title{font-size:19px; font-weight:700; margin-bottom:4px;}
  .act-head-sub{font-size:12.5px; color:var(--muted);}
  .act-head-right{text-align:right; font-size:12px; color:var(--muted); font-family:var(--mono);}
  .act-head-right div{margin-bottom:2px;}

  .act-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:28px;}
  .act-summary-cell{background:var(--panel-2); padding:16px 18px;}
  .act-summary-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px;}
  .act-summary-num{font-size:22px; font-weight:700; font-family:var(--mono);}
  .act-summary-num.warn{color:var(--terracotta);}

  .act-section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); margin-bottom:12px;}

  .act-item{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px;}
  .act-item.discrepancy{border-color:rgba(217,142,110,0.45); background:rgba(217,142,110,0.05);}
  .act-item-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px;}
  .act-item-name{font-size:13.5px; font-weight:600;}
  .act-item-sku{font-size:11.5px; color:var(--muted); font-family:var(--mono);}
  .act-item-bars{display:flex; flex-direction:column; gap:6px;}
  .act-item-row{display:flex; align-items:center; gap:10px; font-size:11.5px;}
  .act-item-row-label{width:76px; flex-shrink:0; color:var(--muted);}
  .act-item-track{flex:1; height:6px; background:var(--bg); border-radius:3px; overflow:hidden;}
  .act-item-fill{height:100%; border-radius:3px;}
  .act-item-fill.declared{background:var(--muted);}
  .act-item-fill.accepted{background:var(--accent);}
  .act-item-fill.accepted.warn{background:var(--terracotta);}
  .act-item-num{width:36px; text-align:right; flex-shrink:0; font-family:var(--mono); font-weight:600;}
  .act-item-note{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12px; color:var(--terracotta); line-height:1.5;}

  .act-footer{margin-top:24px; padding-top:18px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .act-footer-text{font-size:11.5px; color:var(--muted); line-height:1.5;}
  .act-footer-badge{font-size:11px; color:var(--muted); font-family:var(--mono);}

  @media (max-width:640px){
    .ws-body{flex-direction:column;}
    .ws-dates{width:100%; border-right:none; border-bottom:1px solid var(--line); display:flex; gap:6px; overflow-x:auto; white-space:nowrap; padding:12px;}
    .resize-handle{display:none;}
    .ws-dates-title{display:none;}
    .ws-date-item{width:auto; flex-shrink:0;}
    .ws-content{padding:20px;}
    .act-card{padding:24px 20px;}
    .act-summary{grid-template-columns:1fr;}
  }

  /* ===================== VISUAL POLISH LAYER ===================== */
  .ws-header{box-shadow:0 1px 0 rgba(0,0,0,0.2), var(--shadow-sm); position:relative; z-index:5;}
  .ws-brand-dot{filter:drop-shadow(0 0 8px rgba(95,175,166,0.5));}
  .ws-current-account{box-shadow:inset 0 0 0 1px rgba(95,175,166,0.18);}
  .ws-logout{transition:color 0.2s var(--ease);}
  .ws-logout:hover{color:var(--text);}

  .ws-dates{box-shadow:1px 0 0 rgba(0,0,0,0.15);}
  .ws-date-item{transition:background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);}
  .ws-date-item:hover{transform:translateX(2px);}
  .ws-date-item.active{box-shadow:inset 0 0 0 1px rgba(95,175,166,0.16);}
  .ws-mode-btn, .cal-btn{transition:border-color 0.2s var(--ease), background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);}
  .ws-mode-btn:hover, .cal-btn:hover{transform:translateY(-1px);}
  .cal-popover{animation:fadeInUp 0.18s var(--ease) both; backdrop-filter:blur(10px); background:rgba(37,40,44,0.96);}

  .act-card{
    box-shadow:var(--shadow-md);
    background:linear-gradient(165deg, var(--panel) 0%, #1A1C1F 100%);
    animation:fadeInUp 0.35s var(--ease) both;
  }
  .total-current{box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(95,175,166,0.08);}
  .total-current-num{text-shadow:0 0 20px rgba(95,175,166,0.3);}
  .act-summary-cell{transition:background 0.2s var(--ease);}
  .act-summary{box-shadow:var(--shadow-sm);}

  .act-item{transition:border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease); box-shadow:0 1px 4px rgba(0,0,0,0.12);}
  .act-item:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm);}
  .act-item-fill{transition:width 0.3s var(--ease);}
  .act-item.discrepancy{box-shadow:0 1px 4px rgba(217,142,110,0.08);}

  .total-table tr{transition:background 0.15s var(--ease);}
  .total-table tbody tr:hover{background:rgba(255,255,255,0.015);}
</style>
</head>
<body>

  <div class="key-screen" id="keyScreen">
    <div class="key-card">
      <div class="key-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="9" cy="9" r="5.2" stroke="#5FAFA6" stroke-width="1.6"/>
          <path d="M12.7 12.7L20 20M16 16l3-3" stroke="#5FAFA6" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="key-title">Доступ к актам приёмки</div>
      <div class="key-sub">Введите ключ, который вам передал склад — и вы увидите историю приёмки по датам, без звонков.</div>
      <input type="text" class="key-input" id="keyNameInput" placeholder="Ваше имя или компания" style="font-family:var(--sans); letter-spacing:normal; text-align:left;" maxlength="60">
      <input type="text" class="key-input" id="keyInput" placeholder="Например: RM-4821-K" maxlength="20">
      <div class="key-error" id="keyError">Такой ключ не найден. Проверьте, всё ли скопировано верно.</div>
      <button class="key-btn" onclick="checkKey()">Показать акты</button>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <div class="ws-header">
      <div class="ws-brand">
        <svg class="ws-brand-dot" viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11C7 3 12 0.5 16 0.5S25 3 29 11" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M4 9C8 16 12 19 16 19S24 16 28 9" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="16" cy="10" r="4" fill="var(--accent)"/>
          <circle cx="17.2" cy="8.8" r="1" fill="var(--bg)"/>
        </svg>
        Аргус · Склад №1, Люберцы
      </div>
      <div class="ws-current-account" id="wsCurrentAccount"></div>
      <div class="ws-logout" onclick="logout()">Выйти по другому ключу</div>
    </div>
    <div class="ws-body">
      <div class="ws-dates">
        <div class="ws-mode-switch">
          <button class="ws-mode-btn active" id="modeByDate" onclick="setViewMode('dates')">По датам</button>
          <button class="ws-mode-btn" id="modeTotal" onclick="setViewMode('total')">Общий остаток</button>
        </div>
        <div class="ws-dates-head" id="wsDatesHead">
          <div class="ws-dates-title">Даты приёмки</div>
          <button class="cal-btn" onclick="toggleCal(event)" title="Календарь" aria-label="Календарь">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5 1.5v2M11 1.5v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="wsDatesList"></div>
      </div>
      <div class="resize-handle" data-resize="ws-dates" data-direction="right"></div>
      <div class="ws-content" id="wsContent"></div>
    </div>
  </div>

  <div class="cal-popover" id="calPopover">
    <div class="cal-head">
      <button onclick="calChangeMonth(-1)">‹</button>
      <span id="calMonthLabel">Август 2026</span>
      <button onclick="calChangeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

<script>
  const API_BASE = 'https://api.argus-ai.online';
  let TOKEN = localStorage.getItem('argus_token');
  let currentKey = null;
  let currentAccountName = null;
  let acts = []; // built from fetched invoices, shape: {date, number, time, items:[{name,sku,declared,accepted,note}]}

  async function apiFetch(path, options = {}){
    const res = await fetch(API_BASE + path, {
      method: options.method || 'GET',
      headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN ? ('Bearer ' + TOKEN) : '' },
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    if(res.status === 401){
      localStorage.removeItem('argus_token');
      localStorage.removeItem('argus_role');
      TOKEN = null;
      throw new Error('сессия истекла');
    }
    const data = await res.json().catch(() => null);
    if(!res.ok) throw new Error((data && data.error) || 'Ошибка запроса');
    return data;
  }

  function formatActDate(iso){
    const d = new Date(iso);
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  }
  function formatActTime(iso){
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  async function checkKey(){
    const name = document.getElementById('keyNameInput').value.trim();
    const val = document.getElementById('keyInput').value.trim().toUpperCase();
    const error = document.getElementById('keyError');
    error.classList.remove('show');

    if(!name){ error.textContent = 'Введите имя.'; error.classList.add('show'); return; }
    if(!val){ error.textContent = 'Введите ключ доступа.'; error.classList.add('show'); return; }

    try{
      const data = await apiFetch('/api/auth/seller/login', {
        method:'POST', body: {keyCode: val, name},
      });
      TOKEN = data.token;
      localStorage.setItem('argus_token', TOKEN);
      localStorage.setItem('argus_role', 'seller');
      currentKey = val;
      currentAccountName = data.companyName;
      document.getElementById('keyScreen').style.display = 'none';
      document.getElementById('workspace').classList.add('show');
      await loadActs();
    } catch(e){
      error.textContent = e.message || 'Такой ключ не найден. Проверьте, всё ли скопировано верно.';
      error.classList.add('show');
    }
  }

  document.getElementById('keyInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') checkKey();
  });

  async function loadActs(){
    let invoices;
    try{
      invoices = await apiFetch('/api/invoices');
    } catch(e){
      document.getElementById('wsContent').innerHTML = '<div style="color:var(--muted);">Не удалось загрузить акты: ' + e.message + '</div>';
      return;
    }
    if(!currentAccountName) currentAccountName = invoices[0]?.company_name || 'Продавец';
    document.getElementById('wsCurrentAccount').textContent = currentAccountName;
    const started = invoices.filter(inv => inv.status !== 'open');
    if(started.length === 0){
      document.getElementById('wsDatesList').innerHTML = '';
      document.getElementById('wsContent').innerHTML = '<div style="color:var(--muted); text-align:center; padding-top:40px;">Пока нет ни одного акта приёмки по вашим товарам.</div>';
      return;
    }
    const details = await Promise.all(started.map(inv => apiFetch('/api/invoices/' + inv.id)));
    acts = details.map(inv => ({
      date: formatActDate(inv.created_at),
      number: inv.number,
      time: formatActTime(inv.created_at),
      items: inv.items.map(it => {
        const declared = Number(it.declared_qty);
        const accepted = it.receiving_id ? Number(it.accepted_qty) : null;
        const hasDiff = accepted !== null && accepted !== declared;
        return {
          name: it.name, sku: it.sku, declared, accepted,
          note: hasDiff ? `Расхождение ${accepted - declared > 0 ? '+' : ''}${accepted - declared} шт. Заявлено ${declared}, по факту ${accepted}.` : '',
        };
      }),
    })).sort((a, b) => parseActDateObj(b.date) - parseActDateObj(a.date));

    renderDates();
    setViewMode(currentViewMode);
  }

  function parseActDateObj(str){
    const {d, m, y} = parseActDate(str);
    return new Date(y, m - 1, d);
  }

  function logout(){
    localStorage.removeItem('argus_token');
    localStorage.removeItem('argus_role');
    window.location.href = 'index.html';
  }

  function initResizeHandles(){
    document.querySelectorAll('.resize-handle').forEach(handle=>{
      if(handle.dataset.bound) return;
      handle.dataset.bound = 'true';
      const targetName = handle.dataset.resize;
      const direction = handle.dataset.direction;
      const min = 140, max = 480;
      let startX, startWidth, panel;

      handle.addEventListener('mousedown', function(e){
        panel = document.getElementById(targetName) || document.querySelector('.' + targetName);
        if(!panel) return;
        startX = e.clientX;
        startWidth = panel.getBoundingClientRect().width;
        handle.classList.add('dragging');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      function onMove(e){
        const dx = e.clientX - startX;
        let newWidth = direction === 'left' ? startWidth - dx : startWidth + dx;
        newWidth = Math.max(min, Math.min(max, newWidth));
        panel.style.width = newWidth + 'px';
      }
      function onUp(){
        handle.classList.remove('dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
    });
  }
  initResizeHandles();

  let currentViewMode = 'dates';

  function setViewMode(mode){
    if(acts.length === 0) return;
    currentViewMode = mode;
    document.getElementById('modeByDate').classList.toggle('active', mode === 'dates');
    document.getElementById('modeTotal').classList.toggle('active', mode === 'total');
    document.getElementById('wsDatesHead').style.display = mode === 'dates' ? 'flex' : 'none';
    document.getElementById('wsDatesList').style.display = mode === 'dates' ? 'block' : 'none';
    if(mode === 'dates'){
      renderAct(currentActIndex || 0);
    } else {
      renderTotalView();
    }
  }

  function renderTotalView(){
    const sorted = [...acts].sort((a, b) => {
      const da = parseActDate(a.date), db = parseActDate(b.date);
      return new Date(da.y, da.m - 1, da.d) - new Date(db.y, db.m - 1, db.d);
    });

    let running = 0;
    let lastMonth = null;
    let rowsHtml = '';
    sorted.forEach(act => {
      const delivered = act.items.reduce((s, it) => s + (it.accepted || 0), 0);
      running += delivered;
      const parsed = parseActDate(act.date);
      const monthLabel = MONTH_NAMES[parsed.m - 1] + ' ' + parsed.y;
      if(monthLabel !== lastMonth){
        rowsHtml += `<tr><td colspan="4" class="month-sep">${monthLabel}</td></tr>`;
        lastMonth = monthLabel;
      }
      rowsHtml += `
        <tr>
          <td>${act.date}</td>
          <td>№ ${act.number}</td>
          <td class="num delta">+${delivered}</td>
          <td class="num running">${running}</td>
        </tr>
      `;
    });

    document.getElementById('wsContent').innerHTML = `
      <div class="act-wrap">
        <div class="act-card">
          <div class="total-head">
            <div class="total-title">Общий остаток</div>
            <div class="total-sub">${currentAccountName} · нарастающим итогом по всем поставкам</div>
          </div>
          <div class="total-current">
            <span class="total-current-label">Всего привезено и принято</span>
            <span class="total-current-num">${running} шт</span>
          </div>
          <table class="total-table">
            <thead>
              <tr><th>Дата</th><th>Акт</th><th class="num">Привезено</th><th class="num">Итого</th></tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  let calMonth = 7, calYear = 2026;

  function parseActDate(str){
    const [d, m, y] = str.split('.').map(Number);
    return {d, m, y};
  }

  function toggleCal(e){
    e.stopPropagation();
    const pop = document.getElementById('calPopover');
    const opening = !pop.classList.contains('open');
    if(opening){
      const rect = e.currentTarget.getBoundingClientRect();
      pop.style.top = (rect.bottom + 6) + 'px';
      pop.style.left = rect.left + 'px';

      if(acts.length){
        const latest = parseActDate(acts[0].date);
        calMonth = latest.m - 1;
        calYear = latest.y;
      }
      renderCalGrid();
      pop.classList.add('open');
    } else {
      pop.classList.remove('open');
    }
  }

  function calChangeMonth(delta){
    calMonth += delta;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalGrid();
  }

  function renderCalGrid(){
    document.getElementById('calMonthLabel').textContent = MONTH_NAMES[calMonth] + ' ' + calYear;

    const actsByDay = {};
    acts.forEach((act, i) => {
      const parsed = parseActDate(act.date);
      if(parsed.m - 1 === calMonth && parsed.y === calYear){
        actsByDay[parsed.d] = {index: i, warn: act.items.some(it => it.accepted !== null && it.accepted !== it.declared)};
      }
    });

    const firstOfMonth = new Date(calYear, calMonth, 1);
    let startOffset = firstOfMonth.getDay() - 1;
    if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

    const dow = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    let html = dow.map(d => `<div class="cal-dow">${d}</div>`).join('');
    for(let i = 0; i < startOffset; i++) html += `<div class="cal-day"></div>`;
    for(let day = 1; day <= daysInMonth; day++){
      const info = actsByDay[day];
      if(info){
        html += `<div class="cal-day has-act ${info.warn ? 'warn' : ''} ${info.index === currentActIndex ? 'selected' : ''}" onclick="calPickDay(${info.index})">${day}</div>`;
      } else {
        html += `<div class="cal-day">${day}</div>`;
      }
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  function calPickDay(index){
    document.getElementById('calPopover').classList.remove('open');
    renderAct(index);
  }

  document.addEventListener('click', function(e){
    if(!e.target.closest('#calPopover') && !e.target.closest('.cal-btn')){
      document.getElementById('calPopover').classList.remove('open');
    }
  });

  function renderDates(){
    const list = document.getElementById('wsDatesList');
    list.innerHTML = acts.map((act, i) => {
      const hasWarn = act.items.some(it => it.accepted !== null && it.accepted !== it.declared);
      return `<button class="ws-date-item ${i === 0 ? 'active' : ''} ${hasWarn ? 'warn' : ''}" id="date-${i}" onclick="renderAct(${i})">${act.date}<span class="num">Акт № ${act.number}</span></button>`;
    }).join('');
  }

  let currentActIndex = 0;
  function renderAct(index){
    if(acts.length === 0) return;
    currentActIndex = index;
    document.querySelectorAll('.ws-date-item').forEach(d => d.classList.remove('active'));
    const dateBtn = document.getElementById('date-' + index);
    if(dateBtn) dateBtn.classList.add('active');

    const act = acts[index];
    const totalDeclared = act.items.reduce((s, it) => s + it.declared, 0);
    const totalAccepted = act.items.reduce((s, it) => s + (it.accepted || 0), 0);
    const diff = totalAccepted - totalDeclared;

    const itemsHtml = act.items.map(it => {
      const hasDiff = it.accepted !== null && it.accepted !== it.declared;
      const acceptedPct = it.accepted !== null ? Math.round((it.accepted / it.declared) * 100) : 0;
      return `
        <div class="act-item ${hasDiff ? 'discrepancy' : ''}">
          <div class="act-item-top">
            <span class="act-item-name">${it.name}</span>
            <span class="act-item-sku">${it.sku}</span>
          </div>
          <div class="act-item-bars">
            <div class="act-item-row">
              <span class="act-item-row-label">Заявлено</span>
              <div class="act-item-track"><div class="act-item-fill declared" style="width:100%;"></div></div>
              <span class="act-item-num">${it.declared}</span>
            </div>
            <div class="act-item-row">
              <span class="act-item-row-label">Принято</span>
              <div class="act-item-track"><div class="act-item-fill accepted ${hasDiff ? 'warn' : ''}" style="width:${acceptedPct}%;"></div></div>
              <span class="act-item-num">${it.accepted !== null ? it.accepted : '—'}</span>
            </div>
          </div>
          ${it.note ? `<div class="act-item-note">${it.note}</div>` : ''}
        </div>
      `;
    }).join('');

    document.getElementById('wsContent').innerHTML = `
      <div class="act-wrap">
        <div class="act-card">
          <div class="act-head">
            <div>
              <div class="act-head-title">Акт приёмки № ${act.number}</div>
              <div class="act-head-sub">${currentAccountName}</div>
            </div>
            <div class="act-head-right">
              <div>Дата приёмки: ${act.date}</div>
              <div>Время: ${act.time}</div>
              <div>Принял: Кладовщик (ИИ-агент)</div>
            </div>
          </div>

          <div class="act-summary">
            <div class="act-summary-cell">
              <div class="act-summary-label">Заявлено</div>
              <div class="act-summary-num">${totalDeclared} шт</div>
            </div>
            <div class="act-summary-cell">
              <div class="act-summary-label">Принято</div>
              <div class="act-summary-num">${totalAccepted} шт</div>
            </div>
            <div class="act-summary-cell">
              <div class="act-summary-label">Расхождение</div>
              <div class="act-summary-num ${diff !== 0 ? 'warn' : ''}">${diff === 0 ? '0' : diff} шт</div>
            </div>
          </div>

          <div class="act-section-title">Позиции</div>
          ${itemsHtml}

          <div class="act-footer">
            <div class="act-footer-text">Акт сформирован автоматически по результатам сверки штрихкодов при приёмке.</div>
            <div class="act-footer-badge">${currentKey || ''}</div>
          </div>
        </div>
      </div>
    `;
  }

  if(TOKEN && localStorage.getItem('argus_role') === 'seller'){
    document.getElementById('keyScreen').style.display = 'none';
    document.getElementById('workspace').classList.add('show');
    loadActs();
  }
</script>

</body>
</html>
