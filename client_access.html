<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аргус — Кабинет продавца</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --bg:#111315;
    --panel:#1D2023;
    --panel-2:#25282C;
    --line:#32363B;
    --line-soft:#2A2E32;
    --accent:#5FAFA6;
    --accent-2:#7FC9BE;
    --accent-soft:#243634;
    --terracotta:#D98E6E;
    --terracotta-soft:#332822;
    --text:#EDEBE6;
    --muted:#8D9096;
    --mono:'IBM Plex Mono', monospace;
    --sans:'Inter', sans-serif;
    --ease:cubic-bezier(0.16, 1, 0.3, 1);
    --shadow-sm:0 2px 10px rgba(0,0,0,0.24);
    --shadow-md:0 12px 32px rgba(0,0,0,0.34);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scrollbar-color:var(--line) transparent;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px; border:2px solid var(--panel);}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}
  ::selection{background:rgba(95,175,166,0.32); color:var(--text);}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes fadeInUp{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Экран ввода ключа ---------- */
  .key-screen{
    position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at top right, rgba(95,175,166,0.10), transparent 55%),
      radial-gradient(circle at bottom left, rgba(95,175,166,0.08), transparent 50%),
      var(--bg);
  }
  .key-screen::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(ellipse 70% 55% at 50% 40%, black 25%, transparent 72%);
  }
  .key-card{
    position:relative; z-index:1;
    width:100%; max-width:360px;
    background:linear-gradient(165deg, var(--panel) 0%, #1A1C1F 100%);
    border:1px solid var(--line-soft); border-radius:18px;
    padding:36px 32px; text-align:center; box-shadow:var(--shadow-md);
    animation:fadeInUp 0.4s var(--ease) both;
  }
  .key-mark{
    width:52px; height:52px; border-radius:14px;
    background:linear-gradient(145deg, var(--accent-soft), #1D2E2C); margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 18px rgba(95,175,166,0.12);
  }
  .key-title{font-size:17px; font-weight:700; margin-bottom:6px;}
  .key-sub{font-size:12.5px; color:var(--muted); line-height:1.55; margin-bottom:22px;}
  .key-input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; color:var(--text); font-family:var(--mono); font-size:15px; letter-spacing:1.5px;
    text-align:center; margin-bottom:12px;
    transition:border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .key-input::placeholder{color:var(--muted); letter-spacing:normal; font-family:var(--sans); font-size:13px;}
  .key-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3.5px rgba(95,175,166,0.14);}
  .key-error{font-size:12px; color:var(--terracotta); margin-bottom:10px; display:none; text-align:left;}
  .key-error.show{display:block; animation:fadeInUp 0.25s var(--ease) both;}
  .key-btn{
    width:100%; padding:12px; border-radius:9px; border:none;
    background:linear-gradient(135deg, var(--accent-2), var(--accent)); color:#132422;
    font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--sans);
    box-shadow:0 4px 16px rgba(95,175,166,0.22);
    transition:transform 0.2s var(--ease), box-shadow 0.2s var(--ease), filter 0.2s var(--ease);
  }
  .key-btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(95,175,166,0.32); filter:brightness(1.04); opacity:1;}
  .key-btn:active{transform:translateY(0);}

  /* ---------- Рабочая панель ---------- */
  .workspace{display:none; min-height:100vh; flex-direction:column;}
  .workspace.show{display:flex;}

  .ws-header{
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
    padding:16px 28px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  /* Одна полоса вместо трёх.
     Было: шапка, потом переключатель вида, потом строка дат — три уровня
     хрома над содержимым, и ни один не про то, что человек пришёл смотреть.
     Теперь наверху одна полоса: слева склад, по центру вид, справа сам
     продавец и выход. Даты уехали в содержимое: это список документов,
     из которых выбирают, а не часть окна. */
  .ws-brand{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);
    flex:0 0 auto; min-width:0;}
  .ws-brand span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ws-right{display:flex; align-items:center; gap:14px; flex:0 0 auto;}
  /* Выгрузка — действие над содержимым, а не пункт навигации: ссылкой,
     чтобы не спорить весом с переключателем вида. */
  .ws-link{
    background:none; border:none; padding:0; cursor:pointer;
    font-family:var(--sans); font-size:12px; color:var(--muted); text-decoration:underline;
  }
  .ws-link:hover{color:var(--accent);}
  .ws-brand-dot{width:20px; height:13px; flex-shrink:0;}
  /* Кто вошёл — справа, рядом с выходом: это одна мысль, «вы здесь как
     Слим Тим, выйти можно тут же». По центру шапки эта плашка висела ни
     к чему не привязанной. */
  .ws-current-account{font-size:12px; color:var(--accent); font-weight:600;
    background:var(--accent-soft); padding:5px 11px; border-radius:7px; white-space:nowrap;}
  .ws-logout{font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline; white-space:nowrap;}

  /* Сверху вниз, а не слева направо.
     Боковая полоса держала сразу три разные вещи — переключатель вида,
     выгрузку и список дат, — и от этого читалась как свалка. Вид выбирается
     наверху, под шапкой; даты — это содержимое одного из видов, и живут
     строкой под ним. */
  .ws-body{display:flex; flex-direction:column; flex:1; min-height:0;}




  /* Даты — строкой, с прокруткой по горизонтали. Их бывает много, и
     вертикальным списком они забирали ширину у самого документа. */
  .ws-dates{
    display:flex; align-items:center; gap:10px; flex-shrink:0;
    padding:0 0 14px; margin-bottom:4px; border-bottom:1px solid var(--line);
    min-width:0;
  }
  .ws-dates-title{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;
    flex:0 0 auto; margin:0;}
  #wsDatesList{display:flex; gap:6px; overflow-x:auto; flex:1; min-width:0; padding-bottom:6px;}
  /* Полоса прокрутки у дат — тонкая и в цвете темы. Системная светлая
     на тёмном фоне читается как чужая деталь, наклеенная поверх. */
  #wsDatesList::-webkit-scrollbar{height:4px;}
  #wsDatesList::-webkit-scrollbar-track{background:transparent;}
  #wsDatesList::-webkit-scrollbar-thumb{background:var(--line); border-radius:2px;}
  #wsDatesList::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  #wsDatesList{scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
  .ws-date-item{
    display:block; flex:0 0 auto; text-align:left; padding:7px 11px; border-radius:8px; border:none; background:none;
    color:var(--text); font-family:var(--sans); font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .ws-date-item:hover{background:var(--panel-2);}
  .ws-date-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .ws-date-item .num{display:block; font-size:11px; color:var(--muted); font-family:var(--mono); margin-top:2px;}
  .ws-date-item.active .num{color:var(--accent); opacity:0.8;}
  .ws-date-item.warn::before{content:'●'; color:var(--terracotta); font-size:8px; margin-right:6px; vertical-align:middle;}

  .ws-mode-switch{display:flex; gap:6px;}
  .ws-mode-btn{
    padding:8px 14px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; font-family:var(--sans);
    white-space:nowrap;
  }
  .ws-mode-btn:hover{border-color:var(--accent);}
  .ws-mode-btn.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}


  .cal-btn{
    width:26px; height:26px; border-radius:7px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cal-btn:hover{color:var(--accent); border-color:var(--accent);}

  .cal-popover{
    display:none; position:fixed; z-index:150; width:260px; max-width:calc(100vw - 40px);
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 14px 34px rgba(0,0,0,0.5);
  }
  .cal-popover.open{display:block;}
  .cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:12.5px; font-weight:700;}
  .cal-head button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 6px; border-radius:5px;}
  .cal-head button:hover{background:var(--panel); color:var(--accent);}
  .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px;}
  .cal-dow{font-size:9.5px; color:var(--muted); text-align:center; padding:4px 0;}
  .cal-day{
    font-size:11.5px; text-align:center; padding:6px 0; border-radius:6px; cursor:default; color:var(--line);
    font-family:var(--mono); background:none; border:none;
  }
  .cal-day.has-act{color:var(--text); cursor:pointer; position:relative;}
  .cal-day.has-act:hover{background:var(--panel);}
  .cal-day.has-act.warn::after{content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--terracotta);}
  .cal-day.has-act:not(.warn)::after{content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .cal-day.selected{background:var(--accent-soft); color:var(--accent); font-weight:700;}

  /* Содержимое — колонкой: строка дат сверху, вид под ней.
     Контейнер центрировал единственного ребёнка строкой; когда детей
     стало двое, они встали рядом, и карточка акта уехала за правый край.
     Центрирование теперь на внутренней колонке, а не на контейнере. */
  .ws-content{flex:1; overflow-y:auto; padding:24px 32px 32px; min-width:0;}
  .ws-content > *{max-width:860px; margin-left:auto; margin-right:auto;}

  /* ---------- Карточка акта ---------- */
  .act-wrap{width:100%; max-width:640px;}
  .act-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 36px;}

  .total-head{margin-bottom:24px;}
  .total-title{font-size:19px; font-weight:700; margin-bottom:4px;}
  .total-sub{font-size:12.5px; color:var(--muted);}
  /* Три числа рядом — то, ради чего продавец и звонит на склад.
     Одно большое число («можно продавать») не отвечает на его вопрос:
     он видит, что стало меньше, и не знает, продано это или обещано.
     Поэтому три равных клетки, а не одна цифра и мелкая сноска. */
  .trio{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; margin-bottom:16px;
  }
  .trio-cell{background:var(--panel-2); padding:16px 18px;}
  .trio-cell b{
    display:block; font-family:var(--mono); font-size:26px; font-weight:700;
    line-height:1.1; font-variant-numeric:tabular-nums;
  }
  .trio-cell span{display:block; font-size:12px; color:var(--muted); margin-top:5px;}
  .trio-cell i{display:block; font-style:normal; font-size:11px; color:var(--muted); margin-top:3px;}
  /* Доступное — единственное число, по которому продавец принимает решение.
     Ему и акцент; остальные два объясняют, из чего оно получилось. */
  .trio-cell.free b{color:var(--accent);}
  .trio-cell.busy b{color:var(--yellow, #C9A66B);}
  @media (max-width:640px){ .trio{grid-template-columns:1fr;} }
  .trio-sign{
    font-family:var(--mono); font-size:12px; color:var(--muted); margin-bottom:16px;
    display:flex; gap:8px; flex-wrap:wrap;
  }

  .total-current{
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px; padding:18px 20px;
    margin-bottom:26px; display:flex; justify-content:space-between; align-items:center;
  }
  .total-current-label{font-size:12px; color:var(--muted);}
  .total-current-num{font-size:26px; font-weight:700; font-family:var(--mono); color:var(--accent);}
  .total-sku{display:block; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:3px;}
  .total-note{margin:12px 0 4px; padding:11px 13px; border-radius:9px; font-size:12.5px; line-height:1.45;
    background:rgba(217,142,110,0.1); border:1px solid rgba(217,142,110,0.3); color:#D98E6E;}
  .total-table{width:100%; border-collapse:collapse;}
  .total-table th{
    text-align:left; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;
    padding:0 12px 10px; font-weight:600; border-bottom:1px solid var(--line);
  }
  .total-table th.num, .total-table td.num{text-align:right;}
  .total-table td{padding:12px; font-size:13px; border-bottom:1px solid var(--line); font-family:var(--mono);}
  .total-table tr:last-child td{border-bottom:none;}
  .total-table td.month-sep{
    font-family:var(--sans); font-weight:700; color:var(--text); background:var(--panel-2); font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.4px; padding-top:14px; padding-bottom:6px; border-bottom:none;
  }
  .total-table .running{color:var(--accent); font-weight:700;}
  .total-table .delta{color:var(--muted);}
  .act-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:26px; gap:16px; flex-wrap:wrap;}
  .act-head-title{font-size:19px; font-weight:700; margin-bottom:4px;}
  .act-head-sub{font-size:12.5px; color:var(--muted);}
  .act-head-right{text-align:right; font-size:12px; color:var(--muted); font-family:var(--mono);}
  .act-head-right div{margin-bottom:2px;}

  .act-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:28px;}
  .act-summary-cell{background:var(--panel-2); padding:16px 18px;}
  .act-summary-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px;}
  .act-summary-num{font-size:22px; font-weight:700; font-family:var(--mono);}
  .act-summary-num.warn{color:var(--terracotta);}

  .act-section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); margin-bottom:12px;}

  .act-item{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px;}
  .act-item.discrepancy{border-color:rgba(217,142,110,0.45); background:rgba(217,142,110,0.05);}
  .act-item-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:10px;}
  .act-item-name{font-size:13.5px; font-weight:600;}
  .act-item-sku{font-size:11.5px; color:var(--muted); font-family:var(--mono);}
  .act-item-bars{display:flex; flex-direction:column; gap:6px;}
  .act-item-row{display:flex; align-items:center; gap:10px; font-size:11.5px;}
  .act-item-row-label{width:76px; flex-shrink:0; color:var(--muted);}
  .act-item-track{flex:1; height:6px; background:var(--bg); border-radius:3px; overflow:hidden;}
  .act-item-fill{height:100%; border-radius:3px;}
  .act-item-fill.declared{background:var(--muted);}
  .act-item-fill.accepted{background:var(--accent);}
  .act-item-fill.accepted.warn{background:var(--terracotta);}
  .act-item-num{width:36px; text-align:right; flex-shrink:0; font-family:var(--mono); font-weight:600;}
  .act-item-note{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12px; color:var(--terracotta); line-height:1.5;}

  .act-footer{margin-top:24px; padding-top:18px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .act-footer-text{font-size:11.5px; color:var(--muted); line-height:1.5;}
  .act-footer-badge{font-size:11px; color:var(--muted); font-family:var(--mono);}

  @media (max-width:640px){
    .ws-mode-switch{order:3; width:100%;}
    .ws-mode-btn{flex:1;}

    .ws-dates-title{display:none;}
    .ws-content{padding:20px;}
    .act-card{padding:24px 20px;}
    .act-summary{grid-template-columns:1fr;}
  }

  /* ===================== VISUAL POLISH LAYER ===================== */
  .ws-header{box-shadow:0 1px 0 rgba(0,0,0,0.2), var(--shadow-sm); position:relative; z-index:5;}
  .ws-brand-dot{filter:drop-shadow(0 0 8px rgba(95,175,166,0.5));}
  .ws-current-account{box-shadow:inset 0 0 0 1px rgba(95,175,166,0.18);}
  .ws-logout{transition:color 0.2s var(--ease);}
  .ws-logout:hover{color:var(--text);}


  .ws-date-item{transition:background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);}
  .ws-date-item:hover{transform:translateY(-1px);}
  .ws-date-item.active{box-shadow:inset 0 0 0 1px rgba(95,175,166,0.16);}
  .ws-mode-btn, .cal-btn{transition:border-color 0.2s var(--ease), background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);}
  .ws-mode-btn:hover, .cal-btn:hover{transform:translateY(-1px);}
  .cal-popover{animation:fadeInUp 0.18s var(--ease) both; backdrop-filter:blur(10px); background:rgba(37,40,44,0.96);}

  .act-card{
    box-shadow:var(--shadow-md);
    background:linear-gradient(165deg, var(--panel) 0%, #1A1C1F 100%);
    animation:fadeInUp 0.35s var(--ease) both;
  }
  .total-current{box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(95,175,166,0.08);}
  .total-current-num{text-shadow:0 0 20px rgba(95,175,166,0.3);}
  .act-summary-cell{transition:background 0.2s var(--ease);}
  .act-summary{box-shadow:var(--shadow-sm);}

  .act-item{transition:border-color 0.2s var(--ease), transform 0.2s var(--ease), box-shadow 0.2s var(--ease); box-shadow:0 1px 4px rgba(0,0,0,0.12);}
  .act-item:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm);}
  .act-item-fill{transition:width 0.3s var(--ease);}
  .act-item.discrepancy{box-shadow:0 1px 4px rgba(217,142,110,0.08);}

  .total-table tr{transition:background 0.15s var(--ease);}
  .total-table tbody tr:hover{background:rgba(255,255,255,0.015);}
  /* Seller workspace: full-width operational tables, one quiet toolbar. */
  .ws-header{display:grid; grid-template-columns:1fr auto 1fr; padding:16px 28px;}
  .ws-right{justify-self:end;}
  .ws-brand{max-width:260px;}
  .ws-content{padding:30px 32px;}
  .ws-content > *, .act-wrap{max-width:none;}
  .act-card{padding:26px; border-radius:10px; box-shadow:none; background:var(--panel);}
  .stock-heading{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:28px;}
  .stock-heading h1{font-size:28px; margin-bottom:8px; font-weight:600;}
  .trio{border-radius:10px; margin-bottom:12px;}
  .trio-cell{padding:22px 26px; background:var(--panel);}
  .trio-cell b{font-size:clamp(28px,3vw,44px); margin:14px 0 12px; font-weight:500;}
  .trio-cell span{font-size:14px; color:var(--text);}
  .trio-cell.free{background:var(--accent-soft);}
  .trio-cell.busy b{color:var(--text);}
  .stock-reconcile{font-size:12px; color:#A8ACB2; line-height:1.65; margin:10px 0 20px;}
  .stock-tools{display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin:28px 0 18px;}
  #stockSearch{min-width:220px; flex:1; max-width:480px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; font-size:13px; padding:12px 14px; border-radius:7px;}
  #stockCount{margin-left:auto;}
  .short-filter{display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer;}
  .short-filter input{accent-color:var(--accent); width:16px; height:16px;}
  .short-warning{padding:12px 16px; border-left:3px solid #F28F8F; color:#F4A2A2; background:#332326; font-size:13px; margin-bottom:16px;}
  .table-scroll{overflow-x:auto;}
  .stock-table{min-width:700px;}
  .total-table th{font-size:12px; text-transform:none; letter-spacing:normal; padding:12px 16px;}
  .total-table td{padding:18px 16px; font-variant-numeric:tabular-nums;}
  .total-table .product-name{width:40%; font-family:var(--sans);}
  .stock-table .product-name{min-width:260px;}
  .stock-table th.num,.stock-table td.num{min-width:110px;}
  .stock-table .total-sku{white-space:nowrap;}
  .stock-table tbody tr{cursor:pointer;}
  .stock-table tbody tr:hover{background:var(--panel);}
  .product-link{border:0; background:none; color:var(--text); text-align:left; padding:0; font:inherit; font-size:15px; cursor:pointer;}
  .quality-button{border:0; background:none; color:#F4A2A2; font:inherit; text-decoration:underline; padding:4px; cursor:pointer;}
  .short-label{display:block; margin-top:4px; font-size:11px; color:#F4A2A2; white-space:nowrap;}
  .empty-state{padding:30px 10px; color:var(--muted); font-size:14px; line-height:1.7;}
  button:disabled{opacity:.45; cursor:default;}
  :focus-visible{outline:2px solid var(--accent-2); outline-offset:3px;}
  #productHistory{margin:auto; width:min(860px,94vw); max-height:85vh; padding:26px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text);}
  #productHistory::backdrop{background:rgba(0,0,0,.7);}
  .history-head{display:flex; justify-content:space-between; gap:20px; align-items:start;}
  .history-head h2{font-size:21px;}
  .history-event{display:grid; grid-template-columns:145px 1fr auto; gap:20px; padding:16px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.6;}
  .history-event time{color:var(--muted); font-size:12px;}
  .history-event b{font-family:var(--mono); font-weight:500; white-space:nowrap;}
  @media(max-width:1100px){.ws-header{grid-template-columns:1fr auto;}.ws-mode-switch{grid-row:2;grid-column:1 / -1;}.ws-brand{max-width:100%;}}
  @media(max-width:640px){
    .ws-header{padding:14px 16px; gap:14px;}.ws-content{padding:22px 16px;}
    .ws-right{gap:10px;}.ws-current-account{max-width:100px; overflow:hidden; text-overflow:ellipsis;}
    #exportButton{font-size:11px; max-width:85px; text-align:left;}
    .trio{grid-template-columns:repeat(3,minmax(0,1fr));}.trio-cell{padding:14px 10px;}
    .trio-cell span{font-size:11px; min-height:28px;}.trio-cell b{font-size:23px;}.trio-cell i{font-size:10px;}
    .stock-heading h1{font-size:24px;}.stock-tools{gap:14px;}#stockSearch{max-width:none;width:100%;flex-basis:100%;}
    .history-event{grid-template-columns:1fr auto;gap:8px;}.history-event time{grid-column:1 / -1;}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

  <div class="key-screen" id="keyScreen">
    <div class="key-card">
      <div class="key-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="9" cy="9" r="5.2" stroke="#5FAFA6" stroke-width="1.6"/>
          <path d="M12.7 12.7L20 20M16 16l3-3" stroke="#5FAFA6" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="key-title">Кабинет продавца</div>
      <div class="key-sub">Ваш товар на складе: остатки, движения и акты приёмки. Войдите по ключу, который вам передал склад.</div>
      <input type="text" class="key-input" id="keyNameInput" placeholder="Ваше имя или компания" style="font-family:var(--sans); letter-spacing:normal; text-align:left;" maxlength="60">
      <input type="text" class="key-input" id="keyInput" placeholder="Например: RM-4821-K" maxlength="20">
      <div class="key-error" id="keyError">Такой ключ не найден. Проверьте, всё ли скопировано верно.</div>
      <button class="key-btn" onclick="checkKey()">Войти в кабинет</button>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <div class="ws-header">
      <div class="ws-brand" id="wsBrand">
        <svg class="ws-brand-dot" viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11C7 3 12 0.5 16 0.5S25 3 29 11" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M4 9C8 16 12 19 16 19S24 16 28 9" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="16" cy="10" r="4" fill="var(--accent)"/>
          <circle cx="17.2" cy="8.8" r="1" fill="var(--bg)"/>
        </svg>
        <span id="wsWarehouse">Аргус</span>
      </div>

      <div class="ws-mode-switch">
        <button class="ws-mode-btn active" id="modeTotal" onclick="setViewMode('total')">Остаток</button>
        <button class="ws-mode-btn" id="modeMoves" onclick="setViewMode('moves')">Движения</button>
        <button class="ws-mode-btn" id="modeByDate" onclick="setViewMode('dates')">Акты приёмки</button>
      </div>

      <div class="ws-right">
        <button class="ws-link" id="exportButton" onclick="exportCurrentView()">Выгрузить в Excel</button>
        <div class="ws-current-account" id="wsCurrentAccount"></div>
        <button class="ws-link ws-logout" onclick="logout()">Выйти</button>
      </div>
    </div>
    <div class="ws-body">
      <div class="ws-content" id="wsContent">
        <div class="ws-dates" id="wsDatesHead">
          <div class="ws-dates-title">Даты приёмки</div>
          <div id="wsDatesList"></div>
          <button class="cal-btn" onclick="toggleCal(event)" title="Календарь" aria-label="Календарь">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5 1.5v2M11 1.5v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="wsView"></div>
      </div>
    </div>
  </div>

  <div class="cal-popover" id="calPopover">
    <div class="cal-head">
      <button onclick="calChangeMonth(-1)">‹</button>
      <span id="calMonthLabel">Август 2026</span>
      <button onclick="calChangeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

<dialog id="productHistory" aria-labelledby="historyTitle">
  <div class="history-head"><div><h2 id="historyTitle"></h2><p class="total-sku" id="historySku"></p></div>
  <button class="ws-mode-btn" onclick="document.getElementById('productHistory').close()">Закрыть</button></div>
  <p class="stock-reconcile" id="historySummary"></p><div id="historyEvents" aria-live="polite"></div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const API_BASE = 'https://api.argus-ai.online';
  let TOKEN = localStorage.getItem('argus_token');
  let currentKey = null;
  let currentAccountName = null;
  let acts = []; // built from fetched invoices, shape: {date, number, time, items:[{name,sku,declared,accepted,note}]}

  async function apiFetch(path, options = {}){
    const res = await fetch(API_BASE + path, {
      method: options.method || 'GET',
      headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN ? ('Bearer ' + TOKEN) : '' },
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    if(res.status === 401){
      localStorage.removeItem('argus_token');
      localStorage.removeItem('argus_role');
      TOKEN = null;
      document.getElementById('workspace').classList.remove('show');
      document.getElementById('keyScreen').style.display = 'flex';
      throw new Error('сессия истекла');
    }
    const data = await res.json().catch(() => null);
    if(!res.ok) throw new Error((data && data.error) || 'Ошибка запроса');
    return data;
  }

  function formatActDate(iso){
    const d = new Date(iso);
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  }
  function formatActTime(iso){
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  async function checkKey(){
    const name = document.getElementById('keyNameInput').value.trim();
    const val = document.getElementById('keyInput').value.trim().toUpperCase();
    const error = document.getElementById('keyError');
    error.classList.remove('show');

    if(!name){ error.textContent = 'Введите имя.'; error.classList.add('show'); return; }
    if(!val){ error.textContent = 'Введите ключ доступа.'; error.classList.add('show'); return; }

    try{
      const data = await apiFetch('/api/auth/seller/login', {
        method:'POST', body: {keyCode: val, name},
      });
      TOKEN = data.token;
      localStorage.setItem('argus_token', TOKEN);
      // Название склада приходит от сервера. Раньше в шапке было вписано
      // «Склад №1, Люберцы» — и клиент читал выдумку как факт.
      if(data.warehouseName){
        localStorage.setItem('argus_wh_name', data.warehouseName);
      }
      localStorage.setItem('argus_role', 'seller');
      currentKey = val;
      currentAccountName = data.companyName;
      document.getElementById('keyScreen').style.display = 'none';
      document.getElementById('workspace').classList.add('show');
      localStorage.setItem('argus_seller_name', name);
      localStorage.setItem('argus_company_name', data.companyName || '');
      startWorkspace();
    } catch(e){
      error.textContent = e.message || 'Такой ключ не найден. Проверьте, всё ли скопировано верно.';
      error.classList.add('show');
    }
  }

  document.getElementById('keyInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') checkKey();
  });


  async function loadActs(){
    let invoices;
    try{
      // Только приёмки: без direction сюда попадали и заказы на отгрузку, и
      // возвраты — и все они показывались продавцу как «акты приёмки», с
      // пустой колонкой «принято». С заказами маркетплейса этот список стал бы
      // на девять десятых чужим по смыслу.
      invoices = await apiFetch('/api/invoices?direction=in');
    } catch(e){
      if(currentViewMode === 'dates') document.getElementById('wsView').innerHTML = '<div style="color:var(--muted);">Не удалось загрузить акты: ' + escapeHtml(e.message) + '</div>';
      return;
    }
    if(!currentAccountName) currentAccountName = invoices[0]?.company_name || 'Продавец';
    document.getElementById('wsCurrentAccount').textContent = localStorage.getItem('argus_seller_name') || currentAccountName;
    // Название склада — то, что сказал сервер при входе. Пока он его не
    // говорил, в шапке стоит просто «Аргус»: лучше без названия, чем
    // с выдуманным.
    const whName = localStorage.getItem('argus_wh_name');
    if(whName){
      document.getElementById('wsWarehouse').textContent = 'Аргус · ' + whName;
    }
    const started = invoices.filter(inv => inv.status !== 'open');
    if(started.length === 0){
      document.getElementById('wsDatesList').innerHTML = '';
      if(currentViewMode === 'dates') document.getElementById('wsView').innerHTML = '<p class="empty-state">Пока нет ни одного акта приёмки по вашим товарам.</p>';
      return;
    }
    let details;
    try { details = await Promise.all(started.map(inv => apiFetch('/api/invoices/' + inv.id))); }
    catch(e){ if(currentViewMode === 'dates') document.getElementById('wsView').textContent = 'Не удалось загрузить акт: ' + e.message; return; }
    acts = details.map(inv => ({
      date: formatActDate(inv.created_at),
      number: inv.number,
      time: formatActTime(inv.created_at),
      items: inv.items.map(it => {
        const declared = Number(it.declared_qty);
        const accepted = it.receiving_id ? Number(it.accepted_qty) : null;
        const hasDiff = accepted !== null && accepted !== declared;
        return {
          name: it.name, sku: it.sku, declared, accepted,
          note: hasDiff ? `Расхождение ${accepted - declared > 0 ? '+' : ''}${accepted - declared} шт. Заявлено ${declared}, по факту ${accepted}.` : '',
        };
      }),
    })).sort((a, b) => parseActDateObj(b.date) - parseActDateObj(a.date));

    renderDates();
    if(currentViewMode === 'dates') renderAct(currentActIndex || 0);
  }

  function parseActDateObj(str){
    const {d, m, y} = parseActDate(str);
    return new Date(y, m - 1, d);
  }

  function logout(){
    localStorage.removeItem('argus_token');
    localStorage.removeItem('argus_role');
    window.location.href = 'login.html';
  }


  let currentViewMode = 'total';

  function setViewMode(mode){
    // Остаток существует независимо от того, были ли приёмки в Аргусе: товар
    // мог приехать в систему выгрузкой из 1С. Раньше пустой список актов
    // блокировал и остаток тоже.
    currentViewMode = mode;
    document.getElementById('modeByDate').classList.toggle('active', mode === 'dates');
    document.getElementById('modeTotal').classList.toggle('active', mode === 'total');
    document.getElementById('modeMoves').classList.toggle('active', mode === 'moves');
    // Строка дат — содержимое вида «по датам», а не постоянная часть окна:
    // в остатке и движении ей нечего показывать.
    document.getElementById('wsDatesHead').style.display = mode === 'dates' ? 'flex' : 'none';
    document.getElementById('exportButton').disabled = true;
    if(mode === 'dates'){
      if(acts.length) renderAct(currentActIndex || 0);
      else loadActs();
    } else if(mode === 'moves'){
      loadMovements();
    } else {
      loadSellerStock();
    }
  }

  /* ---------- Движение: что отгрузили и что вернулось ----------
     Остаток отвечает на «сколько лежит», но не на «куда делось». Именно из-за
     второго вопроса продавец и звонит на склад. */
  let movements = null;

  const BUCKET_NAME = {
    good: 'годный',
    defective: 'брак',
    packaging_defect: 'повреждена упаковка',
  };

  async function loadMovements(){
    document.getElementById('wsView').innerHTML =
      '<div class="act-wrap"><div class="act-card">Загружаю…</div></div>';
    try{
      movements = await apiFetch('/api/sellers/movements');
    } catch(e){
      if(currentViewMode !== 'moves') return;
      document.getElementById('wsView').innerHTML =
        '<div class="act-wrap"><div class="act-card">Не удалось загрузить: '
        + escapeHtml(e.message) + '</div></div>';
      return;
    }
    if(currentViewMode === 'moves') renderMovements();
  }

  function fmtWhen(iso){
    if(!iso) return '—';
    return new Date(iso).toLocaleString('ru-RU',
      {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
  }

  function renderMovements(){
    document.getElementById('exportButton').disabled = false;
    const sh = movements.shipped;
    const rt = movements.returned;

    const shipHtml = sh.length === 0
      ? '<div style="color:var(--muted); padding:18px 0;">Отгрузок пока не было.</div>'
      : `<table class="total-table">
          <thead><tr><th>Время сборки</th><th>Товар</th><th>Заказ</th><th class="num">Шт</th></tr></thead>
          <tbody>${sh.map(r => `
            <tr>
              <td>${escapeHtml(fmtWhen(r.at))}</td>
              <td>${escapeHtml(r.name)}<span class="total-sku">${escapeHtml(r.sku)}</span></td>
              <td>${escapeHtml(r.order)}<span class="total-sku">${escapeHtml(r.source)}</span></td>
              <td class="num running">${r.qty}</td>
            </tr>`).join('')}</tbody>
        </table>`;

    const retHtml = rt.length === 0
      ? '<div style="color:var(--muted); padding:18px 0;">Возвратов пока не было.</div>'
      : `<table class="total-table">
          <thead><tr><th>Когда</th><th>Товар</th><th>Признано</th><th class="num">Шт</th></tr></thead>
          <tbody>${rt.map(r => `
            <tr>
              <td>${escapeHtml(fmtWhen(r.at))}</td>
              <td>${escapeHtml(r.name)}<span class="total-sku">${escapeHtml(r.sku)}</span></td>
              <td class="${r.bucket === 'good' ? '' : 'delta'}">${escapeHtml(BUCKET_NAME[r.bucket] || r.bucket)}${
                r.note ? `<span class="total-sku">${escapeHtml(r.note)}</span>` : ''}</td>
              <td class="num">${r.qty}</td>
            </tr>`).join('')}</tbody>
        </table>`;

    document.getElementById('wsView').innerHTML = `
      <div class="act-wrap">
        <div class="act-card">
          <div class="total-head">
            <div class="total-title">Отгрузки</div>
            <div class="total-sub">${escapeHtml(currentAccountName)} · отгруженные заказы; указано время подбора товара</div>
          </div>
          ${shipHtml}
        </div>
        <div class="act-card" style="margin-top:16px;">
          <div class="total-head">
            <div class="total-title">Возвраты</div>
            <div class="total-sub">что вернулось и чем это признали при разборе</div>
          </div>
          ${retHtml}
        </div>
      </div>
    `;
  }

  // Настоящий остаток — то, что лежит в ячейках прямо сейчас.
  //
  // Раньше здесь складывались приёмки нарастающим итогом и назывались
  // остатком. Пока склад только принимал, цифра почти совпадала; с первой же
  // отгрузкой она расходится навсегда — и растёт, что бы ни происходило.
  let stockRows = null;

  async function loadSellerStock(){
    document.getElementById('exportButton').disabled = true;
    document.getElementById('wsView').innerHTML = '<p class="empty-state" role="status">Обновляем остаток…</p>';
    try{
      stockRows = await apiFetch('/api/sellers/stock');
      stockLoadedAt = Date.now();
    } catch(e){
      stockRows = null;
      if(currentViewMode !== 'total') return;
      document.getElementById('wsView').innerHTML =
        '<div class="act-wrap"><div class="act-card">Не удалось загрузить остаток: '
        + escapeHtml(e.message) + '<p><button class="ws-mode-btn" onclick="loadSellerStock()">Повторить</button></p></div></div>';
      return;
    }
    if(currentViewMode === 'total') renderTotalView();
  }

  // Экранирование для разметки. textContent + innerHTML не трогает кавычки —
  // в тексте они безопасны, в атрибуте закрывают его и позволяют дописать
  // обработчик события. Подменяем явно, одинаково для текста и атрибутов.
  const ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  // Склонение по числу. В кабинете владельца эта функция есть, здесь её
  // не было — а вызов уже стоял. Ровно так неделю не работал экран
  // заказов: обращение к несуществующей функции падает ПОСЛЕ отрисовки,
  // и экран остаётся на «Загружаем…» без единой жалобы.
  function plural(n, one, few, many){
    const m100 = n % 100; const m10 = n % 10;
    if(m100 >= 11 && m100 <= 14) return many;
    if(m10 === 1) return one;
    if(m10 >= 2 && m10 <= 4) return few;
    return many;
  }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ESCAPE_MAP[c]);
  }

  let stockSearch = '';
  let stockOnlyShort = false;
  let stockLoadedAt = null;

  function startWorkspace(){
    currentAccountName = localStorage.getItem('argus_company_name') || currentAccountName || 'Продавец';
    document.getElementById('wsCurrentAccount').textContent =
      localStorage.getItem('argus_seller_name') || currentAccountName;
    document.getElementById('wsWarehouse').textContent =
      localStorage.getItem('argus_wh_name') || 'Аргус';
    setViewMode('total');
  }

  function filteredStock(){
    const q = stockSearch.trim().toLocaleLowerCase('ru-RU');
    return (stockRows || []).filter(r => (!stockOnlyShort || r.short > 0) &&
      (!q || [r.name, r.sku, r.barcode].some(v => String(v || '').toLocaleLowerCase('ru-RU').includes(q))));
  }
  function num(value){ return Number(value || 0).toLocaleString('ru-RU'); }

  function renderStockTable(){
    const rows = filteredStock();
    document.getElementById('stockCount').textContent = 'Показано товаров: ' + rows.length;
    document.getElementById('stockTableBody').innerHTML = rows.length ? rows.map(r => {
      const index = stockRows.indexOf(r);
      return `<tr data-stock-index="${index}" tabindex="0" aria-label="История товара: ${escapeHtml(r.name)}">
        <td class="product-name"><button class="product-link" onclick="openStockHistory(${index})">${escapeHtml(r.name)}</button><span class="total-sku">${escapeHtml(r.sku)}</span></td>
        <td class="num">${num(r.onHand)}${r.staged > 0 ? `<span class="total-sku">в сборке ${num(r.staged)}</span>` : ''}</td>
        <td class="num">${num(r.ordered)}</td>
        <td class="num running">${num(r.available)}${r.short > 0 ? `<span class="short-label">не хватает ${num(r.short)}</span>` : ''}</td>
        <td class="num">${r.notForSale > 0 ? `<button class="quality-button" onclick="openStockHistory(${index}, true)">${num(r.notForSale)}</button>` : '—'}</td>
        <td class="num">${num(r.cells)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="6" class="empty-state">Нет товаров по этому фильтру. Измените поиск или отключите «Только нехватка».</td></tr>';
    document.getElementById('exportButton').disabled = rows.length === 0;
  }

  function renderTotalView(){
    if(stockRows === null) return;
    const sum = field => stockRows.reduce((n,r) => n + Number(r[field] || 0), 0);
    const compared = stockRows.filter(r => r.qtyIn1c !== null && r.qtyIn1c !== undefined);
    const mismatches = compared.filter(r => Number(r.qtyIn1c) !== r.onHand);
    const discrepancy = mismatches.reduce((n,r) => n + Math.abs(Number(r.qtyIn1c) - r.onHand), 0);
    const total1c = compared.reduce((n,r) => n + Number(r.qtyIn1c), 0);
    const shortRows = stockRows.filter(r => r.short > 0);
    const staged = sum('staged');
    document.getElementById('wsView').innerHTML = `
      <section class="stock-page">
        <div class="stock-heading">
          <div><h1>Остаток</h1><p class="total-sub">${escapeHtml(currentAccountName)} · обновлено ${escapeHtml(new Date(stockLoadedAt).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'}))}</p></div>
          <button class="ws-mode-btn" onclick="loadSellerStock()">Обновить</button>
        </div>
        <div class="trio">
          <div class="trio-cell"><span>На складе</span><b>${num(sum('onHand'))}</b><i>годный товар, включая собранное</i></div>
          <div class="trio-cell busy"><span>В заказах</span><b>${num(sum('ordered'))}</b><i>ещё не отгружено</i></div>
          <div class="trio-cell free"><span>Доступно к продаже</span><b>${num(sum('available'))}</b><i>можно продать сейчас</i></div>
        </div>
        ${mismatches.length ? `<p class="stock-reconcile">По учёту 1С: ${num(total1c)} · расхождения по ${mismatches.length} товарам, всего ${num(discrepancy)} шт${compared.length < stockRows.length ? ' · сверка доступна не по всем товарам' : ''}</p>` : ''}
        ${staged > 0 ? `<p class="stock-reconcile">${num(staged)} шт уже сняты с полок для заказов и ещё находятся на складе.</p>` : ''}
        <div class="stock-tools">
          <input id="stockSearch" type="search" placeholder="Найти товар, артикул или штрихкод" aria-label="Поиск товара" value="${escapeHtml(stockSearch)}">
          <label class="short-filter"><input id="stockOnlyShort" type="checkbox" ${stockOnlyShort ? 'checked' : ''}> Только нехватка</label>
          <span id="stockCount" class="total-sub"></span>
        </div>
        ${shortRows.length ? `<div class="short-warning" role="status">По ${shortRows.length} ${plural(shortRows.length, 'товару', 'товарам', 'товарам')} заказов больше, чем товара — не хватает ${num(sum('short'))} шт.</div>` : ''}
        ${!stockRows.length ? '<p class="empty-state">На складе пока нет вашего товара. Остатки появятся после приёмки.</p>' : ''}
        <div class="table-scroll"><table class="total-table stock-table">
          <thead><tr><th>Товар</th><th class="num">На складе</th><th class="num">В заказах</th><th class="num">Доступно</th><th class="num">Не в продаже</th><th class="num">Ячеек</th></tr></thead>
          <tbody id="stockTableBody"></tbody>
        </table></div>
        <p class="stock-reconcile">Нажмите на товар, чтобы посмотреть его историю. Доступное считается по каждому товару: излишек одного не покрывает нехватку другого.</p>
      </section>`;
    renderStockTable();
    document.getElementById('stockSearch').addEventListener('input', e => { stockSearch = e.target.value; renderStockTable(); });
    document.getElementById('stockOnlyShort').addEventListener('change', e => { stockOnlyShort = e.target.checked; renderStockTable(); });
    const body = document.getElementById('stockTableBody');
    body.addEventListener('click', e => {
      if(e.target.closest('button')) return;
      const row = e.target.closest('[data-stock-index]');
      if(row) openStockHistory(Number(row.dataset.stockIndex));
    });
    body.addEventListener('keydown', e => {
      if(e.target.tagName === 'TR' && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault(); openStockHistory(Number(e.target.dataset.stockIndex));
      }
    });
  }

  let historyRequest = 0;
  async function openStockHistory(index, qualityOnly = false){
    const r = stockRows[index];
    const dialog = document.getElementById('productHistory');
    document.getElementById('historyTitle').textContent = r.name;
    document.getElementById('historySku').textContent = r.sku;
    document.getElementById('historySummary').textContent = qualityOnly
      ? 'Не в продаже: ' + num(r.notForSale) + ' шт. Брак: ' + num(r.defective) + ', повреждена упаковка: ' + num(r.packagingDefect) + '.'
      : 'На складе: ' + num(r.onHand) + ' · В заказах: ' + num(r.ordered) + ' · Доступно: ' + num(r.available);
    const target = document.getElementById('historyEvents');
    target.textContent = 'Загружаем историю…';
    if(!dialog.open) dialog.showModal();
    const request = ++historyRequest;
    try {
      const data = await apiFetch('/api/sellers/history?sku=' + encodeURIComponent(r.sku));
      if(request !== historyRequest) return;
      const names = {received:'Приехало', picked:'Собрано для заказа', returned:'Вернулось', move:'Перемещено', repack:'Перепаковано', kit_assemble:'Собран набор'};
      const events = qualityOnly ? data.events.filter(e => e.kind === 'returned' && e.quality !== 'good') : data.events;
      target.innerHTML = '<p class="stock-reconcile">Операции по документам и складские операции. Для сборки указано время подбора, не отъезда машины.</p>' +
        (events.length ? events.map(e => `<div class="history-event">
          <time>${escapeHtml(fmtWhen(e.at))}</time>
          <div>${escapeHtml(names[e.kind] || e.kind)}${e.document ? ' · ' + escapeHtml(e.document) : ''}
            ${e.quality ? '<span class="total-sku">' + escapeHtml(BUCKET_NAME[e.quality] || e.quality) + '</span>' : ''}
            ${e.note ? '<p>' + escapeHtml(e.note) + '</p>' : ''}
            ${e.kind === 'picked' ? '<span class="total-sku">' + (e.status === 'shipped' ? 'Заказ отгружен' : 'Заказ ещё на складе') + '</span>' : ''}</div>
          <b>${e.kind === 'received' || e.kind === 'returned' ? '+' : ''}${num(e.qty)} шт</b>
        </div>`).join('') : '<p class="empty-state">Зафиксированных операций пока нет.</p>') +
        (data.hasMore ? '<p class="stock-reconcile">Показаны последние 200 операций. Более ранние записи в эту ленту не вошли.</p>' : '');
    } catch(e) { if(request === historyRequest) target.textContent = 'Не удалось загрузить историю: ' + e.message; }
  }

  function exportCurrentView(){
    if(typeof XLSX === 'undefined'){ alert('Выгрузка ещё загружается. Повторите через секунду.'); return; }
    let rows, name;
    if(currentViewMode === 'total'){
      name = 'Остаток';
      rows = filteredStock().map(r => ({'Товар':r.name, 'Артикул':r.sku, 'На складе':r.onHand, 'В заказах':r.ordered,
        'Доступно':r.available, 'Не в продаже':r.notForSale, 'Ячеек':r.cells}));
    } else if(currentViewMode === 'dates'){
      name = 'Акт приёмки';
      const act = acts[currentActIndex];
      rows = act ? act.items.map(it => ({'Товар':it.name, 'Артикул':it.sku, 'Заявлено':it.declared,
        'Принято':it.accepted, 'Расхождение':it.accepted === null ? '' : it.accepted - it.declared})) : [];
    } else {
      name = 'Движения';
      const book = XLSX.utils.book_new();
      for(const [sheet, data] of [
        ['Уехало', (movements?.shipped || []).map(r => ({'Время сборки':fmtWhen(r.at),'Товар':r.name,'Артикул':r.sku,'Заказ':r.order,'Площадка':r.source,'Шт':r.qty}))],
        ['Вернулось', (movements?.returned || []).map(r => ({'Когда':fmtWhen(r.at),'Товар':r.name,'Артикул':r.sku,'Признано':BUCKET_NAME[r.bucket] || r.bucket,'Описание':r.note || '', 'Шт':r.qty}))]
      ]) XLSX.utils.book_append_sheet(book, XLSX.utils.json_to_sheet(data), sheet);
      XLSX.writeFile(book, name + '.xlsx'); return;
    }
    if(!rows.length) return;
    const book = XLSX.utils.book_new();
    const sheet = XLSX.utils.json_to_sheet(rows);
    sheet['!cols'] = Object.keys(rows[0]).map((_,i) => ({wch:i === 0 ? 45 : 20}));
    XLSX.utils.book_append_sheet(book, sheet, name);
    XLSX.writeFile(book, name + '.xlsx');
  }

  const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  let calMonth = 7, calYear = 2026;

  function parseActDate(str){
    const [d, m, y] = str.split('.').map(Number);
    return {d, m, y};
  }

  function toggleCal(e){
    e.stopPropagation();
    const pop = document.getElementById('calPopover');
    const opening = !pop.classList.contains('open');
    if(opening){
      const rect = e.currentTarget.getBoundingClientRect();
      pop.style.top = (rect.bottom + 6) + 'px';
      pop.style.left = rect.left + 'px';

      if(acts.length){
        const latest = parseActDate(acts[0].date);
        calMonth = latest.m - 1;
        calYear = latest.y;
      }
      renderCalGrid();
      pop.classList.add('open');
    } else {
      pop.classList.remove('open');
    }
  }

  function calChangeMonth(delta){
    calMonth += delta;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalGrid();
  }

  function renderCalGrid(){
    document.getElementById('calMonthLabel').textContent = MONTH_NAMES[calMonth] + ' ' + calYear;

    const actsByDay = {};
    acts.forEach((act, i) => {
      const parsed = parseActDate(act.date);
      if(parsed.m - 1 === calMonth && parsed.y === calYear){
        actsByDay[parsed.d] = {index: i, warn: act.items.some(it => it.accepted !== null && it.accepted !== it.declared)};
      }
    });

    const firstOfMonth = new Date(calYear, calMonth, 1);
    let startOffset = firstOfMonth.getDay() - 1;
    if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

    const dow = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    let html = dow.map(d => `<div class="cal-dow">${d}</div>`).join('');
    for(let i = 0; i < startOffset; i++) html += `<div class="cal-day"></div>`;
    for(let day = 1; day <= daysInMonth; day++){
      const info = actsByDay[day];
      if(info){
        html += `<div class="cal-day has-act ${info.warn ? 'warn' : ''} ${info.index === currentActIndex ? 'selected' : ''}" onclick="calPickDay(${info.index})">${day}</div>`;
      } else {
        html += `<div class="cal-day">${day}</div>`;
      }
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  function calPickDay(index){
    document.getElementById('calPopover').classList.remove('open');
    renderAct(index);
  }

  document.addEventListener('click', function(e){
    if(!e.target.closest('#calPopover') && !e.target.closest('.cal-btn')){
      document.getElementById('calPopover').classList.remove('open');
    }
  });

  function renderDates(){
    const list = document.getElementById('wsDatesList');
    list.innerHTML = acts.map((act, i) => {
      const hasWarn = act.items.some(it => it.accepted !== null && it.accepted !== it.declared);
      return `<button class="ws-date-item ${i === 0 ? 'active' : ''} ${hasWarn ? 'warn' : ''}" id="date-${i}" onclick="renderAct(${i})">${escapeHtml(act.date)}<span class="num">Акт № ${escapeHtml(act.number)}</span></button>`;
    }).join('');
  }

  let currentActIndex = 0;
  function renderAct(index){
    if(acts.length === 0) return;
    document.getElementById('exportButton').disabled = false;
    currentActIndex = index;
    document.querySelectorAll('.ws-date-item').forEach(d => d.classList.remove('active'));
    const dateBtn = document.getElementById('date-' + index);
    if(dateBtn) dateBtn.classList.add('active');

    const act = acts[index];
    const totalDeclared = act.items.reduce((s, it) => s + it.declared, 0);
    const totalAccepted = act.items.reduce((s, it) => s + (it.accepted || 0), 0);
    const diff = totalAccepted - totalDeclared;

    const itemsHtml = act.items.map(it => {
      const hasDiff = it.accepted !== null && it.accepted !== it.declared;
      const acceptedPct = it.accepted !== null ? Math.round((it.accepted / it.declared) * 100) : 0;
      return `
        <div class="act-item ${hasDiff ? 'discrepancy' : ''}">
          <div class="act-item-top">
            <span class="act-item-name">${escapeHtml(it.name)}</span>
            <span class="act-item-sku">${escapeHtml(it.sku)}</span>
          </div>
          <div class="act-item-bars">
            <div class="act-item-row">
              <span class="act-item-row-label">Заявлено</span>
              <div class="act-item-track"><div class="act-item-fill declared" style="width:100%;"></div></div>
              <span class="act-item-num">${it.declared}</span>
            </div>
            <div class="act-item-row">
              <span class="act-item-row-label">Принято</span>
              <div class="act-item-track"><div class="act-item-fill accepted ${hasDiff ? 'warn' : ''}" style="width:${acceptedPct}%;"></div></div>
              <span class="act-item-num">${it.accepted !== null ? it.accepted : '—'}</span>
            </div>
          </div>
          ${it.note ? `<div class="act-item-note">${escapeHtml(it.note)}</div>` : ''}
        </div>
      `;
    }).join('');

    document.getElementById('wsView').innerHTML = `
      <div class="act-wrap">
        <div class="act-card">
          <div class="act-head">
            <div>
              <div class="act-head-title">Акт приёмки № ${escapeHtml(act.number)}</div>
              <div class="act-head-sub">${escapeHtml(currentAccountName)}</div>
            </div>
            <div class="act-head-right">
              <div>Дата приёмки: ${escapeHtml(act.date)}</div>
              <div>Время: ${escapeHtml(act.time)}</div>
              <div>Исполнитель не указан в данных акта</div>
            </div>
          </div>

          <div class="act-summary">
            <div class="act-summary-cell">
              <div class="act-summary-label">Заявлено</div>
              <div class="act-summary-num">${totalDeclared} шт</div>
            </div>
            <div class="act-summary-cell">
              <div class="act-summary-label">Принято</div>
              <div class="act-summary-num">${totalAccepted} шт</div>
            </div>
            <div class="act-summary-cell">
              <div class="act-summary-label">Расхождение</div>
              <div class="act-summary-num ${diff !== 0 ? 'warn' : ''}">${diff === 0 ? '0' : diff} шт</div>
            </div>
          </div>

          <div class="act-section-title">Позиции</div>
          ${itemsHtml}

          <div class="act-footer">
            <div class="act-footer-text">Акт сформирован по записанным результатам приёмки.</div>
          </div>
        </div>
      </div>
    `;
  }

  if(TOKEN && localStorage.getItem('argus_role') === 'seller'){
    document.getElementById('keyScreen').style.display = 'none';
    document.getElementById('workspace').classList.add('show');
    startWorkspace();
  }
</script>

</body>
</html>
