<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сверка заказов WB — Аргус</title>
  <style>
    :root{color-scheme:dark;--bg:#111315;--panel:#1d2023;--line:#32363b;--text:#edebe6;--muted:#afb6bd;--accent:#7fc9be;--warn:#e1b67d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 Arial,sans-serif}main{padding:32px 40px;max-width:2200px;margin:auto}a{color:var(--accent)}h1{font-size:32px;margin:20px 0 10px}h2{font-size:24px;margin:0 0 16px}p{max-width:85ch;color:var(--muted)}header{display:flex;justify-content:space-between;gap:24px;align-items:center}button{font:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:10px 18px}button.primary{background:var(--accent);color:#122824;font-weight:600}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.table-scroll{overflow-x:auto;margin-top:24px}table{border-collapse:collapse;width:100%;text-align:left}th{background:var(--panel);font-weight:400;color:var(--muted)}th,td{padding:15px 18px;border-bottom:1px solid var(--line);vertical-align:top}.number{text-align:right;font-family:Consolas,monospace;font-variant-numeric:tabular-nums}.message{margin:20px 0;color:var(--muted)}.error{color:var(--warn)}[hidden]{display:none!important}#detail{margin-top:32px;border:1px solid var(--line);padding:24px}#detail:focus{outline:none}.detail-header{display:flex;justify-content:space-between;gap:20px}.confirm{display:flex;align-items:flex-start;gap:12px;margin:22px 0;max-width:90ch}.confirm input{margin-top:7px;min-width:20px;min-height:20px}#loadMore{margin-top:24px}.meta{color:var(--muted);font-size:16px}#blocked{color:var(--warn)}@media(max-width:700px){main{padding:20px 16px}header{align-items:flex-start;flex-wrap:wrap}h1{font-size:27px}th,td{padding:12px}#detail{padding:18px}.table-scroll{margin-top:18px}}
  </style>
</head>
<body>
<main>
  <header><a href="cabinet_main.html">Вернуться к складу</a><button id="refresh" type="button">Обновить</button></header>
  <h1>Сверка заказов WB</h1>
  <p>WB закрыл заказ, а в Аргусе остался отбор, поставка или неподтверждённый отъезд. Проверьте товар на складе и подтвердите выполненное действие.</p>
  <div id="message" class="message" role="status" aria-live="polite">Загрузка заказов…</div>
  <div class="table-scroll"><table id="orders" hidden><thead><tr><th>Заказ</th><th>Продавец</th><th>Данные WB</th><th class="number">Подобрано, шт.</th><th>Действие</th></tr></thead><tbody></tbody></table></div>
  <button id="loadMore" type="button" hidden>Показать ещё</button>
  <section id="detail" hidden tabindex="-1" aria-labelledby="detailTitle">
    <div class="detail-header"><h2 id="detailTitle"></h2><button id="closeDetail" type="button">Закрыть</button></div>
    <p id="detailInfo"></p>
    <div class="table-scroll"><table><thead><tr><th>Товар</th><th>Исходная ячейка</th><th class="number">Количество, шт.</th></tr></thead><tbody id="lines"></tbody></table></div>
    <p id="blocked" role="status"></p>
    <form id="confirmForm" hidden>
      <label id="departureField" hidden>Фактическая дата и время отъезда (ваше местное время)<br><input id="departedAt" type="datetime-local" step="1" style="font:inherit;padding:10px;margin-top:8px;max-width:100%"></label>
      <label class="confirm"><input id="confirmed" type="checkbox" required><span id="confirmationText"></span></label>
      <button id="confirmButton" class="primary" type="submit" disabled>Подтвердить</button>
    </form>
    <p id="resolutionMessage" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="marketplace-reconciliation.js"></script>
</body>
</html>
